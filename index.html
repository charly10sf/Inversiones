<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>GrowFolio</title>
<meta name="description" content="GrowFolio: tu cartera de inversión en directo, a tu medida">
<meta name="robots" content="noindex, nofollow">
<link rel="manifest" href="manifest.webmanifest" vite-ignore>
<!-- iconos con nombre nuevo: así el navegador deja de enseñar el de antes (Bellota) que tenía guardado -->
<link rel="icon" href="growfolio-32.png" type="image/png" sizes="32x32" vite-ignore>
<link rel="icon" href="growfolio.svg" type="image/svg+xml" vite-ignore>
<link rel="apple-touch-icon" href="growfolio-180.png" vite-ignore>
<meta name="application-name" content="GrowFolio">
<meta name="theme-color" content="#000000">
<!-- 0.7v: el diseño de Toisón elegido (solo el dueño, mientras dura el rediseño), puesto antes de pintar para que no
     salga un instante el de GrowFolio. El color de la barra lo pone después ponerTema (01-base.js) desde los tokens -->
<script>try{var t=JSON.parse(localStorage.getItem('inv-tema'));if(t==='marmol'||t==='marfil'||t==='borgona')document.documentElement.setAttribute('data-tema',t);}catch(e){}</script>
<!-- las letras de Toisón, de la casa (sin Google Fonts); solo se bajan si un diseño de Toisón las usa -->
<style>
@font-face{font-family:'Inter';src:url(fonts/inter.woff2) format('woff2');font-weight:100 900;font-display:swap}
@font-face{font-family:'Ibarra Real Nova';src:url(fonts/ibarra.woff2) format('woff2');font-weight:400 700;font-display:swap}
@font-face{font-family:'Ibarra Real Nova';src:url(fonts/ibarra-italic.woff2) format('woff2');font-weight:400 700;font-style:italic;font-display:swap}
</style>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="GrowFolio">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@200..800&display=swap" rel="stylesheet">
<!-- gf:css: el build pone aquí el CSS (src/css, en el orden de src/partes.json) -->
</head>
<body>
<div id="app"></div>
<div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
<!-- gf:js: y aquí el JS (src/js) -->
</body>
</html>
