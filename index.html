<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Toisón</title>
<meta name="description" content="Toisón: tus inversiones en un solo sitio, con los precios en directo">
<meta name="robots" content="noindex, nofollow">
<link rel="manifest" href="manifest.webmanifest" vite-ignore>
<!-- 0.8: los iconos de Toisón, con nombre nuevo para que el navegador deje el de GrowFolio que tenía guardado -->
<link rel="icon" href="toison-32.png" type="image/png" sizes="32x32" vite-ignore>
<link rel="icon" href="favicon.svg" type="image/svg+xml" vite-ignore>
<link rel="apple-touch-icon" href="toison-180.png" vite-ignore>
<meta name="application-name" content="Toisón">
<meta name="theme-color" content="#151817">
<!-- el diseño de Toisón elegido (Mármol si no hay ninguno), puesto antes de pintar. El color de la barra lo pone
     después ponerTema (01-base.js) desde los tokens -->
<script>var t='marmol';try{var g=JSON.parse(localStorage.getItem('inv-tema'));if(g==='marfil'||g==='borgona')t=g;}catch(e){}document.documentElement.setAttribute('data-tema',t);</script>
<!-- las letras de Toisón, de la casa (sin Google Fonts) -->
<style>
@font-face{font-family:'Inter';src:url(fonts/inter.woff2) format('woff2');font-weight:100 900;font-display:swap}
@font-face{font-family:'Ibarra Real Nova';src:url(fonts/ibarra.woff2) format('woff2');font-weight:400 700;font-display:swap}
@font-face{font-family:'Ibarra Real Nova';src:url(fonts/ibarra-italic.woff2) format('woff2');font-weight:400 700;font-style:italic;font-display:swap}
/* 0.8 (5b): el «VI» de la pastilla de GTA de la cabecera usa la recta inclinada por el navegador (en dos mayúsculas
   no se distingue de la cursiva): así la cursiva, 29 KB, no se baja al abrir en Mármol y Marfil. Mismo archivo que la recta */
@font-face{font-family:'Ibarra VI';src:url(fonts/ibarra.woff2) format('woff2');font-weight:400 700;font-display:swap}
</style>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Toisón">
<!-- gf:css: el build pone aquí el CSS (src/css, en el orden de src/partes.json) -->
</head>
<body>
<div id="app"></div>
<div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

</html>
