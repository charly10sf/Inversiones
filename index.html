  const v = valoresIA(M);
  const R = (t) => rellenarIA(t || '', v);
  const f = String(ia.fecha || '');
  const d = new Date(f.length > 10 ? f : f + 'T12:00:00');
  const hora = d.toLocaleTimeString('es-ES', { hour: '2-digit', minute: '2-digit' });
  const dias = diasEntre(iso(d), hoyIso());

/* =====================================================================
   Futuro: cuánto podrías tener si sigues aportando
   Se simulan 2.000 caminos de mercado mes a mes. Cada tipo de activo tiene una rentabilidad
   esperada y una volatilidad a largo plazo; con tu mezcla (y cómo cambia al ir aportando) sale la
   rentabilidad y el riesgo de la cartera cada mes. De los 2.000 resultados se sacan los escenarios:
   "si va mal" es el percentil 10 (1 de cada 10 caminos sale peor), "lo probable" la mediana y
   "si va bien" el percentil 90.
   ===================================================================== */
const SUPUESTOS = {
  rv: { n: 'Fondos de bolsa', mu: 7, sd: 16 },
  acc: { n: 'Acciones sueltas', mu: 7, sd: 25 },
  rf: { n: 'Renta fija', mu: 2.5, sd: 2.5 },
  oro: { n: 'Oro', mu: 4, sd: 15 },
  cripto: { n: 'Bitcoin', mu: 8, sd: 50 },
  ef: { n: 'Efectivo', mu: 1.5, sd: 0 },
};
// correlaciones a largo plazo entre tipos de activo (las que no están, 0)
const CORREL = { 'rv|acc': 0.75, 'rv|rf': 0.2, 'rv|oro': 0.1, 'rv|cripto': 0.35, 'acc|rf': 0.15, 'acc|oro': 0.1, 'acc|cripto': 0.3, 'rf|oro': 0.25, 'rf|cripto': 0.05, 'oro|cripto': 0.15 };
const corr = (a, b) => (a === b ? 1 : CORREL[a + '|' + b] ?? CORREL[b + '|' + a] ?? 0);
const INFLACION = 2;
const HORIZONTES = [5, 10, 15, 20, 25, 30];
const META_HITOS = [100000, 250000, 500000, 1000000];

function claseProy(inst) {
  if (!inst) return 'rv';
  if (inst.tipo === 'Acción') return 'acc';
  if (inst.clase === 'Renta fija' || inst.clase === 'Monetario') return 'rf';
  if (inst.clase === 'Oro') return 'oro';
  if (inst.clase === 'Cripto') return 'cripto';
  return 'rv';
}
function aportacionActual() { return sum(aportacionesActivas(), ({ a }) => +a.importe || 0); }
function cfgProy() {
  const c = S.proy || {};
  return { aport: c.aport != null ? c.aport : Math.round(aportacionActual()), subida: c.subida ?? 0, bolsa: c.bolsa ?? 7, real: c.real ?? false };
}

/* generador aleatorio con semilla: los escenarios no bailan cada vez que se pinta la página */
function azar(semilla) {
  let a = semilla >>> 0;
  const u = () => { a = (a + 0x6D2B79F5) >>> 0; let t = a; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
  let resto = null;
  return () => { // normal estándar (Box-Muller)
    if (resto != null) { const r = resto; resto = null; return r; }
    let x = 0, y = 0; while (x === 0) x = u(); y = u();
    const m = Math.sqrt(-2 * Math.log(x));
    resto = m * Math.sin(2 * Math.PI * y);
    return m * Math.cos(2 * Math.PI * y);
  };
}

function proyeccion(M) {
  const cfg = cfgProy();
  const clave = JSON.stringify([Math.round(M.total / 50), cfg, aportacionesActivas().map(({ a }) => [a.instrumento, a.importe])]);
  if (S.proyCache && S.proyCache.clave === clave) return S.proyCache.r;
  const MESES_N = 30 * 12, N = 2000;
  const sup = JSON.parse(JSON.stringify(SUPUESTOS));
  sup.rv.mu = cfg.bolsa; sup.acc.mu = cfg.bolsa;
  const claves = Object.keys(sup);
  // dónde está el dinero hoy y adónde van las aportaciones
  const ahora = Object.fromEntries(claves.map((k) => [k, 0]));
  for (const f of M.filas) ahora[claseProy(f.inst)] += f.valor;
  ahora.ef += M.liquidez;
  const destino = Object.fromEntries(claves.map((k) => [k, 0]));
  const act = aportacionesActivas();
  const totAp = sum(act, ({ a }) => +a.importe || 0);
  if (totAp > 0) for (const { a } of act) destino[claseProy(S.inst[a.instrumento])] += (+a.importe || 0) / totAp; else destino.rv = 1;
  // camino esperado de la mezcla: con él se saca la rentabilidad y el riesgo de cada mes
  const v = { ...ahora };
  const mu = new Float64Array(MESES_N), sd = new Float64Array(MESES_N), aporte = new Float64Array(MESES_N);
  for (let t = 0; t < MESES_N; t++) {
    const A = cfg.aport * Math.pow(1 + cfg.subida / 100, Math.floor(t / 12));
    aporte[t] = A;
    const tot = sum(claves.map((k) => v[k])) || 1;
    const w = Object.fromEntries(claves.map((k) => [k, v[k] / tot]));
    let m = 0, var2 = 0;
    for (const i of claves) { m += w[i] * sup[i].mu / 100; for (const j of claves) var2 += w[i] * w[j] * corr(i, j) * (sup[i].sd / 100) * (sup[j].sd / 100); }
    mu[t] = m; sd[t] = Math.sqrt(Math.max(var2, 0));
    for (const k of claves) v[k] = v[k] * Math.pow(1 + sup[k].mu / 100, 1 / 12) + A * destino[k];
  }
  // 2.000 caminos
  const rnd = azar(20261017);
  const vals = Array.from({ length: MESES_N }, () => new Float64Array(N));
  for (let n = 0; n < N; n++) {
    let V = M.total;
    for (let t = 0; t < MESES_N; t++) {
      const deriva = (Math.log(1 + mu[t]) - (sd[t] * sd[t]) / 2) / 12, vol = sd[t] / Math.sqrt(12);
      V = V * Math.exp(deriva + vol * rnd()) + aporte[t];
      vals[t][n] = V;
    }
  }
  const pct = (arr, q) => arr[Math.min(arr.length - 1, Math.max(0, Math.round(q * (arr.length - 1))))];
  const out = { p10: [], p25: [], p50: [], p75: [], p90: [], aportado: [], fechas: [], mu: mu[0] * 100, sd: sd[0] * 100, mu10: mu[119] * 100, sd10: sd[119] * 100, ahora, destino, sup, cfg };
  let puesto = M.total;
  const hoy = new Date();
  out.fechas.push(iso(hoy)); out.aportado.push(M.total);
  for (const q of ['p10', 'p25', 'p50', 'p75', 'p90']) out[q].push(M.total);
  for (let t = 0; t < MESES_N; t++) {
    const orden = Float64Array.from(vals[t]).sort();
    const def = cfg.real ? Math.pow(1 + INFLACION / 100, (t + 1) / 12) : 1;
    puesto += aporte[t];
    out.p10.push(pct(orden, 0.1) / def); out.p25.push(pct(orden, 0.25) / def); out.p50.push(pct(orden, 0.5) / def); out.p75.push(pct(orden, 0.75) / def); out.p90.push(pct(orden, 0.9) / def);
    out.aportado.push(puesto / def);
    out.fechas.push(iso(new Date(hoy.getFullYear(), hoy.getMonth() + t + 1, Math.min(hoy.getDate(), 28))));
  }
  S.proyCache = { clave, r: out };
  return out;
}

const cuando = (meses) => { const a = Math.floor(meses / 12), m = meses % 12; return a ? `${a} ${a === 1 ? 'año' : 'años'}${m ? ` y ${m} ${m === 1 ? 'mes' : 'meses'}` : ''}` : `${m} ${m === 1 ? 'mes' : 'meses'}`; };
const anioDe = (iso8) => iso8.slice(0, 4);
function hito(pr, serie, meta) { const i = serie.findIndex((x) => x >= meta); return i < 0 ? null : i; }
function euCorto(n) {
  if (S.oculto) return '•••• €';
  if (n >= 1e6) { const t = fmtNum(n / 1e6, n >= 1e7 ? 1 : 2).replace(/,0+$/, '').replace(/(,\d)0$/, '$1'); return t + (t === '1' ? ' millón €' : ' millones €'); }
  return fmtNum(Math.round(n / 1000) * 1000, 0) + ' €';
}

/* =====================================================================
   Objetivos: quién eres como inversor (edad, situación, cuándo necesitas el dinero, cuánto riesgo
   aguantas, tus límites) y tus metas con cifra y fecha. Va dentro de la cartera cifrada. Con esto se
   ajustan la IA, el Paso a paso y la lectura de tu cartera: no se invierte igual a los 24 que a los 60.
   La IA, además, pregunta lo que le falte para afinar sus consejos.
   ===================================================================== */
const PERFIL_DEF = { nombre: null, edad: null, situacion: null, ingresos_mes: null, gastos_mes: null, colchon_meses: 6, horizonte: null, riesgo: null, experiencia: null, estilo: null, deudas: null, limite_cripto: 5, limite_empresa: 10, limite_oro: 10 };
const perfil = () => ({ ...PERFIL_DEF, ...((S.cartera && S.cartera.perfil) || {}) });
const perfilVacio = () => { const p = (S.cartera && S.cartera.perfil) || {}; return !p.edad && !p.horizonte && !p.riesgo; };
const SITUACION = { estudiante: 'Estudiando', trabajando: 'Trabajando por cuenta ajena', autonomo: 'Autónomo o empresa propia', paro: 'Buscando trabajo', jubilado: 'Jubilado' };
// se pueden marcar varias (estudias y trabajas): se guardan juntas, "estudiante,trabajando"
const situacionTxt = (s) => { const t = String(s || '').split(',').map((k) => SITUACION[k]).filter(Boolean).map((x, i) => (i ? x.toLowerCase() : x)); return t.length ? yLista(t) : ''; };
const RIESGO = {
  bajo: ['Vendería', 'para no perder más', 'Prudente'],
  medio: ['Esperaría', 'a que se recupere', 'Equilibrado'],
  alto: ['Compraría más', 'aprovechando que está barato', 'Decidido'],
};
const EXPERIENCIA = { poca: 'Estoy empezando', algo: 'Llevo un par de años', mucha: 'Llevo muchos años' };
const ESTILO = { crecimiento: 'Que crezca, aunque no dé dividendos', equilibrio: 'Un poco de todo', dividendos: 'Cobrar dividendos cada año' };
const DEUDAS = { no: 'Ninguna', hipoteca: 'Hipoteca', consumo: 'Préstamos o tarjetas' };
const HORIZONTES_P = [[2, 'en menos de 3 años'], [5, 'en 3 a 5 años'], [10, 'en 5 a 10 años'], [20, 'en 10 a 20 años'], [30, 'en más de 20 años']];
const textoHorizonte = (h) => (HORIZONTES_P.find(([x]) => x === +h) || [, h ? `en ${h} años` : '—'])[1];

/* cuánto en bolsa le toca a tu perfil: por el riesgo que aguantas, recortado por el plazo y la edad */
function bolsaRecomendada(p) {
  if (!p.riesgo && !p.horizonte && !p.edad) return null;
  let b = { bajo: 50, medio: 75, alto: 95 }[p.riesgo] ?? 75;
  const h = +p.horizonte;
  if (h && h <= 2) b = Math.min(b, 20); else if (h && h <= 5) b = Math.min(b, 45); else if (h && h <= 10) b = Math.min(b, 75);
  if (+p.edad >= 50) b -= Math.min(30, +p.edad - 50);
  b = Math.max(10, Math.min(100, Math.round(b / 5) * 5));
  return { pct: b, min: Math.max(0, b - 10), max: Math.min(100, b + 10) };
}

/* la foto de tu cartera frente a tu perfil */
function estadoPerfil(M) {
  const p = perfil(), total = M.total || 0;
  const v = (fn) => sum(M.filas.filter(fn), (f) => f.valor);
  const pc = (x) => (total ? (x / total) * 100 : 0);
  const sueltas = v((f) => f.inst.tipo === 'Acción'), cripto = v((f) => f.inst.clase === 'Cripto'), oro = v((f) => f.inst.clase === 'Oro');
  const bolsa = v((f) => f.inst.clase === 'Renta variable');
  const seguro = v((f) => ['Renta fija', 'Monetario'].includes(f.inst.clase)) + (M.liquidez || 0);
  const acciones = M.filas.filter((f) => f.inst.tipo === 'Acción').map((f) => ({ f, pct: pc(f.valor) })).sort((a, b) => b.pct - a.pct);
  const colchon = p.gastos_mes ? +p.gastos_mes * (+p.colchon_meses || 6) : null;
  return { p, total, pctSueltas: pc(sueltas), pctCripto: pc(cripto), pctOro: pc(oro), pctBolsa: pc(bolsa), cripto, seguro, colchon, mayor: acciones[0] || null, reco: bolsaRecomendada(p), metas: evaluarMetas(M) };
}

/* cada meta frente a la proyección: lo probable en su fecha, descontando las metas anteriores que se gastan */
function evaluarMetas(M) {
  const metas = ((S.cartera && S.cartera.metas) || []).filter((m) => m && +m.importe > 0);
  if (!metas.length) return [];
  let pr = null; try { pr = proyeccion(M); } catch (e) {}
  const hoy = new Date();
  let gastado = 0;
  return [...metas].sort((a, b) => (+a.anio || 9999) - (+b.anio || 9999)).map((m0) => {
    const m = { ...m0, importe: +m0.importe, anio: +m0.anio || null };
    m.pct = Math.max(0, Math.min(100, ((M.total - gastado) / m.importe) * 100));
    if (m.anio && pr) {
      m.meses = Math.max(1, Math.min(360, (m.anio - hoy.getFullYear()) * 12 + (11 - hoy.getMonth())));
      m.prob = pr.p50[m.meses] - gastado; m.mal = pr.p10[m.meses] - gastado;
      m.ok = m.prob >= m.importe; m.seguro = m.mal >= m.importe;
      m.falta = Math.max(0, m.importe - m.prob); m.extraMes = m.falta ? m.falta / m.meses : 0;
    } else if (pr) {
      const i = pr.p50.findIndex((x) => x - gastado >= m.importe);
      m.cuando = i >= 0 ? pr.fechas[i] : null; m.ok = i >= 0;
    }
    if (m.tipo !== 'llegar') gastado += m.importe;
    return m;
  });
}
function textoMeta(m) {
  if (!m.anio) return m.cuando ? (m.pct >= 100 ? 'Ya lo tienes.' : `Lo probable es llegar en ${MESES[deIso(m.cuando).getMonth()]} de ${m.cuando.slice(0, 4)}, con lo que aportas ahora.`) : 'Con lo que aportas ahora no llegas en 30 años: súbele la aportación en Proyección para ver cuánto haría falta.';
  if (m.prob == null) return '';
  if (m.seguro) return `Llegas de sobra: en ${m.anio} lo probable es tener ${euCorto(m.prob)}, e incluso si va mal, ${euCorto(m.mal)}.`;
  if (m.ok) return `Llegas en lo probable (${euCorto(m.prob)} en ${m.anio}), pero si la bolsa va mal te quedarías en ${euCorto(Math.max(0, m.mal))}.${m.tipo !== 'llegar' && m.meses <= 36 ? ' Como es en menos de 3 años, ve pasando ese dinero a algo que no baje.' : ''}`;
  return `Te faltarían unos ${eur(m.falta, 0)}: súbele unos ${eur(Math.ceil(m.extraMes / 10) * 10, 0)} al mes a la aportación o retrásala.`;
}

/* ---------- tus límites como un reparto: acciones sueltas, cripto y oro no pueden sumar más del 100 % ----------
   Al subir una, las otras bajan (la más grande primero). Lo que queda es para fondos y lo demás. El máximo en una
   sola empresa va dentro de las acciones sueltas: nunca puede ser mayor. */
const REPARTO = [['lim', 'Acciones sueltas', 'empresas compradas una a una, fuera de fondos', 100], ['cripto', 'Cripto', '', 50], ['oro', 'Oro y materias primas', '', 50]];
function htmlReparto(acc, cri, oro, emp) {
  const v = { lim: acc, cripto: cri, oro };
  const desl = (n, t, sub, max, val, cl) => `<label class="rp-desl ${cl}"><span class="rp-t"><span>${t}</span><b><output data-o="${n}">${fmtNum(val, 0)}</output> %</b></span><input type="range" name="${n}" min="0" max="${max}" step="1" value="${val}">${sub ? `<small class="k">${sub}</small>` : ''}</label>`;
  return `<div class="reparto" id="reparto">
      <p class="nota">Lo máximo que quieres tener en cada cosa. Si al subir una os pasáis del 100 %, las demás bajan solas.</p>
      <div class="rp-barra" aria-hidden="true"><i class="rb-lim"><i class="rb-emp"></i></i><i class="rb-cripto"></i><i class="rb-oro"></i><i class="rb-resto"></i></div>
      ${REPARTO.map(([n, t, sub, max]) => desl(n, t, sub, max, Math.min(max, v[n]), 'rp-' + n)).join('')}
      <p class="rp-queda"><span>Fondos y lo demás</span><b><output data-o="resto"></output> %</b></p>
      ${desl('empresa', 'Una sola empresa', 'dentro de las acciones sueltas: nunca más que ellas', Math.max(acc, 1), Math.min(emp, acc), 'rp-empresa')}
    </div>`;
}
function enlazarReparto(rp) {
  if (!rp) return;
  const R = (n) => rp.querySelector(`[name="${n}"]`), grupo = REPARTO.map(([n]) => n);
  const pintarRp = () => {
    const val = (n) => +R(n).value, a = val('lim'), resto = Math.max(0, 100 - grupo.reduce((t, n) => t + val(n), 0));
    for (const o of rp.querySelectorAll('output[data-o]')) o.textContent = fmtNum(o.dataset.o === 'resto' ? resto : val(o.dataset.o), 0);
    for (const n of grupo) rp.querySelector('.rp-barra > .rb-' + n).style.width = val(n) + '%';
    rp.querySelector('.rp-barra .rb-resto').style.width = resto + '%';
    rp.querySelector('.rb-emp').style.width = (a ? Math.min(100, (val('empresa') / a) * 100) : 0) + '%';
    for (const n of [...grupo, 'empresa']) { const el = R(n); el.style.setProperty('--v', ((el.value - el.min) / ((el.max - el.min) || 1)) * 100 + '%'); }
  };
  const ajusta = (movido) => {
    let sobra = grupo.reduce((t, n) => t + +R(n).value, 0) - 100;
    if (sobra > 0) for (const n of grupo.filter((x) => x !== movido).sort((x, y) => R(y).value - R(x).value)) {
      const q = Math.min(+R(n).value, sobra); R(n).value = +R(n).value - q; sobra -= q; if (sobra <= 0) break;
    }
    const a = +R('lim').value, e = R('empresa');
    e.max = Math.max(a, 1); if (+e.value > a) e.value = a;
    pintarRp();
  };
  for (const n of [...grupo, 'empresa']) R(n).addEventListener('input', () => ajusta(n));
  pintarRp();
}
function barraLimite(t, actual, limite, sub) {
  const pasa = actual > limite + 0.5;
  return `<div class="pf-lim${pasa ? ' pasa' : ''}"><div class="pf-lim-t"><span>${t}</span><b>${fmtNum(actual, 1)} %<small> de ${fmtNum(limite, 0)} %</small></b></div>
    <div class="pf-barra"><i style="width:${Math.min(100, (actual / Math.max(limite, 0.1)) * 100).toFixed(0)}%"></i></div>${sub ? `<small class="k">${sub}</small>` : ''}</div>`;
}

  if (d.length) L.push(d.join('; ') + '.');

  L.push(`Sus límites: acciones sueltas ${fmtNum(+(S.cartera.limite_acciones ?? 20), 0)} % (lleva ${fmtNum(e.pctSueltas, 1)} %), cripto ${fmtNum(+p.limite_cripto, 0)} % (lleva ${fmtNum(e.pctCripto, 1)} %), una sola empresa ${fmtNum(+p.limite_empresa, 0)} %${e.mayor ? ` (la mayor, ${e.mayor.f.inst.corto}, ${fmtNum(e.mayor.pct, 1)} %)` : ''}.`);
  if (e.colchon) L.push(`Colchón que quiere: ${p.colchon_meses} meses de gastos, ${E0(e.colchon)}. Tiene ${E0(e.seguro)} entre efectivo, monetarios y renta fija.`);

/* los pasos que salen de tu perfil: colchón, límites, metas y bolsa frente a lo que aguantas */
function pasosPerfil(M, add) {
  const e = estadoPerfil(M), p = e.p, hoy = hoyIso(), mes = hoy.slice(0, 7);
  if (perfilVacio()) add('mes', { id: 'perfil:0', cuando: 'un minuto', t: 'Cuéntale a GrowFolio tu edad, tus metas y cuánto riesgo aguantas', pq: 'Con eso estos pasos, las ideas y la IA se ajustan a ti: no se invierte igual a los 24 que a los 60.', acc: '<a class="enlace" href="#objetivos">Rellenar tu perfil</a>' });
  if (p.deudas === 'consumo') add('mes', { id: `deuda:${mes}`, cuando: 'antes que nada', t: 'Liquida los préstamos o tarjetas antes de invertir más', pq: 'Suelen costar un 7-25 % al año: devolverlos es una rentabilidad segura que la bolsa no te garantiza.', como: 'Lo que ibas a aportar este mes, a amortizar el préstamo más caro. Las aportaciones automáticas, en pausa hasta acabar.' });
  if (e.colchon && e.seguro < e.colchon * 0.9) add('mes', { id: `colchonf:${mes}`, cuando: 'antes de meter más en bolsa', t: `Completa tu colchón: te faltan ${eur(e.colchon - e.seguro, 0)}`, pq: `Son ${p.colchon_meses} meses de tus gastos (${eur(e.colchon, 0)}). Ahora tienes ${eur(e.seguro, 0)} entre efectivo, monetarios y renta fija.`, como: 'Ve apartando cada mes en el efectivo remunerado de Trade Republic o en un fondo monetario de MyInvestor hasta llegar. Es el dinero de los imprevistos: así nunca tienes que vender en una caída.', imp: 'Los intereses del efectivo y de los monetarios tributan como los dividendos (19-23 %); el monetario no paga nada hasta que lo vendas.', acc: '<a class="enlace" href="#objetivos">Ver tu perfil</a>' });
  const limC = +(p.limite_cripto ?? 5);
  if (e.pctCripto > limC + 1 && e.total) { const exceso = e.cripto - (limC / 100) * e.total; add('mes', { id: `limcripto:${mes}`, cuando: 'sin prisa', t: `La cripto pasa de tu límite: ${fmtNum(e.pctCripto, 1)} % de un ${fmtNum(limC, 0)} %`, pq: `Para volver a tu ${fmtNum(limC, 0)} % tendrías que pasar unos ${eur(exceso, 0)} a otra cosa, o dejar de comprar cripto hasta que tus aportaciones la diluyan.`, como: 'Vende esa parte en Bitvavo, pásala a tu banco y de ahí a tu fondo indexado.', imp: 'Si vendes con ganancia, tributa como cualquier venta (19-23 %). Cambiarla por otra cripto también cuenta como venta.' }); }
  if (e.reco && e.pctBolsa - e.reco.pct > 15) add('anio', { id: `perfilbolsa:${mes}`, cuando: 'poco a poco', t: `Tu cartera arriesga más de lo que encaja contigo: ${fmtNum(e.pctBolsa, 0)} % en bolsa`, pq: `Para tu edad, tu plazo y lo que dices aguantar, lo normal es un ${e.reco.min}-${e.reco.max} %.`, como: 'Sin vender nada: manda las próximas aportaciones a un fondo de renta fija o monetario hasta acercarte.', imp: 'Así no pagas nada: no vendes, solo cambias adónde va lo nuevo. Entre fondos, cambia con traspasos.', acc: '<a class="enlace" href="#objetivos">Ver tu perfil</a>' });
  for (const m of e.metas) {
    if (m.tipo !== 'llegar' && m.meses && m.meses <= 36) add(m.meses <= 6 ? 'mes' : 'seis', { id: `metaseg:${m.id}`, cuando: `para ${m.anio}`, t: `Pon a salvo el dinero de «${esc(m.n)}»`, pq: `La necesitas en ${cuando(m.meses)}: si la bolsa cae justo antes, no da tiempo a que se recupere.`, como: `Ve pasando ${eur(m.importe, 0)} a un monetario o a renta fija corta, poco a poco, antes de ${m.anio}.`, imp: 'De un fondo a otro, con traspaso: no pagas nada hasta que saques el dinero. Si vendes acciones o ETF, la ganancia tributa al vender.' });
    else if (m.falta > 0) add('anio', { id: `metafalta:${m.id}:${mes}`, cuando: m.anio ? `para ${m.anio}` : '', t: `Para «${esc(m.n)}» te faltarían unos ${eur(m.falta, 0)}`, pq: `Lo probable es tener ${euCorto(m.prob)} en ${m.anio} y necesitas ${eur(m.importe, 0)}.`, como: `Súbele unos ${eur(Math.ceil(m.extraMes / 10) * 10, 0)} al mes a la aportación, o retrasa la meta un par de años.`, acc: '<a class="enlace" href="#objetivos">Ver tus metas</a>' });
  }
}

  return `<div class="vista-cab"><h1>Objetivos</h1><p>Quién eres como inversor, para qué inviertes y cuánto podrías tener. La IA, las ideas y el Paso a paso se ajustan a esto.</p></div>
  <div class="subvistas dos-op" id="futTabs" role="group" aria-label="Qué ver"><button data-fut="perfil" aria-pressed="${t === 'perfil'}">${ICONOS.perfil}Tú y tus metas${preguntasIA().length ? `<span class="cuenta">${preguntasIA().length}</span>` : ''}</button><button data-fut="proy" aria-pressed="${t === 'proy'}">${ICONOS.proy}Proyección</button></div>
  ${t === 'perfil' ? htmlPerfil(M) : htmlProyeccion(M)}`;
}
function htmlProyeccion(M) {
  const pr = proyeccion(M);

  const H = S.horizonte || 20;
  const i = H * 12;

  const sel = (nombre, valores, actual, fmt) => `<select data-proy="${nombre}">${valores.map((x) => `<option value="${x}"${+actual === x ? ' selected' : ''}>${fmt(x)}</option>`).join('')}</select>`;
  const pesos = Object.entries(pr.ahora).filter(([, x]) => x > 0);
  const totAhora = sum(pesos.map(([, x]) => x)) || 1;
  return `
  <p class="nota" style="margin:0 0 18px">Lo que podrías tener si sigues invirtiendo como ahora, con 2.000 escenarios de mercado simulados.</p>
  <div class="proy-controles">
    <label class="campo">Aportas al mes<span class="con-ud"><input data-proy="aport" inputmode="numeric" value="${val(c.aport)}"><span>€</span></span><small>${c.aport === Math.round(aportacionActual()) ? `Es lo de tu plan de ahora` : `Tu plan: ${eur(aportacionActual(), 0)}. <button type="button" class="enlace acento" data-proy-reset>Volver a tu plan</button>`}</small></label>
    <label class="campo">Subes la aportación cada año${sel('subida', [0, 2, 3, 5, 10], c.subida, (x) => (x ? `un ${x} %` : 'No'))}<small>Por ejemplo, con las subidas de sueldo</small></label>
    <label class="campo">La bolsa da a largo plazo${sel('bolsa', [4, 5, 6, 7, 8, 9], c.bolsa, (x) => `${x} % al año`)}<small>La media histórica mundial ronda el 7 %</small></label>
    <label class="check proy-real"><input type="checkbox" data-proy="real" ${c.real ? 'checked' : ''}> En euros de hoy<small class="k">descontando un ${INFLACION} % de inflación al año</small></label>
  </div>
  <section class="proy-cab">
    <div class="tabs" role="group" aria-label="Horizonte">${HORIZONTES.map((h) => `<button data-horizonte="${h}" aria-pressed="${H === h}">${h} años</button>`).join('')}</div>
    <div class="proy-titular">
      <div class="hero-lbl">En ${H} años, en ${anioDe(fin)}, tendrías${c.real ? ' (en euros de hoy)' : ''}</div>
      <div class="proy-num">${euCorto(probable)}</div>
      <div class="proy-esc">
        <div><span class="k">Si va mal</span><b class="down">${euCorto(pr.p10[i])}</b><small>1 de cada 10 escenarios sale peor</small></div>
        <div><span class="k">Lo probable</span><b class="acento">${euCorto(probable)}</b><small>la mitad sale mejor y la mitad peor</small></div>
        <div><span class="k">Si va bien</span><b class="up">${euCorto(pr.p90[i])}</b><small>1 de cada 10 sale mejor</small></div>
        <div><span class="k">Habrás puesto tú</span><b>${euCorto(puesto)}</b><small>lo demás lo ponen los mercados</small></div>
      </div>
    </div>
  </section>
  <div class="chart" id="grafProy"></div>
  <div class="leyenda-graf"><span><i style="border-color:var(--accent);border-top-width:3px"></i>Lo probable</span><span><i class="banda"></i>La mitad de los escenarios</span><span><i class="banda clara"></i>8 de cada 10</span><span><i class="disc" style="border-color:var(--text-2)"></i>Lo que habrás puesto</span></div>
  <div class="dos" style="margin-top:48px">
    <section aria-labelledby="hHor">
      <div class="sec-cab"><h2 id="hHor">Por horizonte</h2><span class="k">${c.real ? 'en euros de hoy' : 'en euros de cada año'}</span></div>
      <div class="tabla-w"><table class="resp"><thead><tr><th>Dentro de</th><th class="r">Habrás puesto</th><th class="r">Si va mal</th><th class="r">Lo probable</th><th class="r">Si va bien</th></tr></thead><tbody>
        ${HORIZONTES.map((h) => { const k = h * 12; return `<tr class="${h === H ? 'activa' : ''}"><td><b style="font-weight:600">${h} años</b><small>${anioDe(pr.fechas[k])}</small></td><td class="r">${euCorto(pr.aportado[k])}</td><td class="r down">${euCorto(pr.p10[k])}</td><td class="r acento">${euCorto(pr.p50[k])}</td><td class="r up">${euCorto(pr.p90[k])}</td></tr>`; }).join('')}
      </tbody></table></div>
    </section>
    <aside class="lateral" aria-labelledby="hHit">
      <div class="sec-cab"><h2 id="hHit">Cuándo llegarías a</h2></div>
      <ul class="lista hitos">${META_HITOS.map((m) => { const a = hito(pr, pr.p50, m), r = hito(pr, pr.p90, m), l = hito(pr, pr.p10, m); return `<li><span class="meta">${euCorto(m)}</span><div>${a == null ? '<b>Más de 30 años</b><span>con esta aportación</span>' : `<b>${a === 0 ? 'Ya lo tienes' : `En ${cuando(a)}, en ${anioDe(pr.fechas[a])}`}</b><span>${a === 0 ? '' : `Si va bien, en ${anioDe(pr.fechas[r])}. Si va mal, ${l == null ? 'después de 30 años' : `en ${anioDe(pr.fechas[l])}`}.`}</span>`}</div></li>`; }).join('')}</ul>
    </aside>
  </div>
  <section style="margin-top:48px" aria-labelledby="hSup"><details class="sec-det"${innerWidth > 680 ? ' open' : ''}>
    <summary class="sec-cab"><h2 id="hSup">Con qué se calcula</h2><span class="k">tu cartera hoy: ${fmtNum(pr.mu, 1)} % al año esperado; se movería un ${fmtNum(pr.sd, 0)} % a largo plazo</span></summary>
    <div class="tabla-w"><table class="resp"><thead><tr><th>Tipo de activo</th><th class="r">Tienes</th><th class="r">Va de tus aportaciones</th><th class="r">Rentabilidad esperada</th><th class="r">Volatilidad</th></tr></thead><tbody>
      ${Object.entries(pr.sup).filter(([k]) => pr.ahora[k] > 0 || pr.destino[k] > 0).map(([k, s]) => `<tr><td><b style="font-weight:600">${esc(s.n)}</b></td><td class="r">${pct((pr.ahora[k] / totAhora) * 100, 1)}</td><td class="r">${pct(pr.destino[k] * 100, 0)}</td><td class="r">${pct(s.mu, 1)}</td><td class="r">${pct(s.sd, 0)}</td></tr>`).join('')}
    </tbody></table></div>
    <p class="nota">Rentabilidades y volatilidades a largo plazo en euros, antes de impuestos y después de los gastos de los fondos. Son supuestos razonables, no promesas: la bolsa mundial ha dado de media en torno a un 7 % al año durante décadas, pero con años de −30 %. Como lo que aportas va casi todo a fondos de bolsa, dentro de 10 años la cartera esperaría un ${fmtNum(pr.mu10, 1)} % al año con una volatilidad del ${fmtNum(pr.sd10, 0)} %. Las acciones sueltas y Bitcoin tienen la misma rentabilidad esperada que la bolsa o poco más, pero mucho más riesgo: por eso ensanchan el abanico. Cada escenario sigue un camino mes a mes con caídas y subidas al azar, siempre con la misma semilla para que los números no cambien al recargar.</p>
  </details></section>`;
}

/* abanico: banda del 10-90 %, banda del 25-75 %, mediana y lo aportado */
function grafAbanico(cont, pr, meses, opt = {}) {
  cont.innerHTML = '';
  const n = meses + 1;
  const W = Math.max(260, cont.clientWidth || 600), H = opt.alto || 320;
  const ml = 4, mr = 62, mt = 12, mb = 26;
  const hi = Math.max(...pr.p90.slice(0, n)) * 1.04, lo = 0;
  const x = (i) => ml + (i / (n - 1)) * (W - ml - mr);
  const y = (v) => mt + (1 - (v - lo) / (hi - lo)) * (H - mt - mb);
  const lin = (arr) => arr.slice(0, n).map((v, i) => `${x(i).toFixed(1)},${y(v).toFixed(1)}`).join(' ');
  const banda = (a, b) => `${lin(a)} ${b.slice(0, n).map((v, i) => [i, v]).reverse().map(([i, v]) => `${x(i).toFixed(1)},${y(v).toFixed(1)}`).join(' ')}`;
  let g = '';
  for (const t of niceTicks(lo, hi, 4)) {
    g += `<line x1="${ml}" x2="${W - mr}" y1="${y(t)}" y2="${y(t)}" stroke="var(--line)" stroke-width="1"/>`;
    g += `<text x="${W - mr + 8}" y="${y(t) + 4}" font-size="11" fill="var(--muted)" style="font-variant-numeric:tabular-nums">${S.oculto ? '' : compacto(t)}</text>`;
  }
  const anios = meses / 12, caben = Math.max(2, Math.floor((W - ml - mr) / 46));
  const paso = [1, 2, 5, 10].find((p) => anios / p + 1 <= caben) || 10;
  for (let a = 0; a <= anios; a += paso) g += `<text x="${x(a * 12)}" y="${H - 6}" text-anchor="${a === 0 ? 'start' : a >= anios ? 'end' : 'middle'}" font-size="11" fill="var(--muted)">${anioDe(pr.fechas[a * 12])}</text>`;
  g += `<polygon points="${banda(pr.p90, pr.p10)}" fill="var(--accent)" fill-opacity="0.10"/>`;
  g += `<polygon points="${banda(pr.p75, pr.p25)}" fill="var(--accent)" fill-opacity="0.20"/>`;
  g += `<polyline points="${lin(pr.aportado)}" fill="none" stroke="var(--text-2)" stroke-width="1.4" stroke-dasharray="5 4"/>`;
  g += `<polyline points="${lin(pr.p50)}" fill="none" stroke="var(--accent)" stroke-width="2.4" stroke-linejoin="round"/>`;
  g += `<circle cx="${x(n - 1)}" cy="${y(pr.p50[n - 1])}" r="4" fill="var(--accent)" stroke="var(--bg)" stroke-width="2"/>`;
  g += `<g class="cruz" visibility="hidden"><line y1="${mt}" y2="${H - mb}" stroke="var(--line-2)" stroke-width="1"/><circle r="4.5" fill="var(--accent)" stroke="var(--bg)" stroke-width="2"/></g>`;
  g += `<rect x="${ml}" y="0" width="${W - ml - mr}" height="${H}" fill="transparent" class="zona"/>`;
  const NS = 'http://www.w3.org/2000/svg';
  const svg = document.createElementNS(NS, 'svg');
  svg.setAttribute('viewBox', `0 0 ${W} ${H}`); svg.setAttribute('height', H);
  svg.setAttribute('role', 'img'); svg.setAttribute('aria-label', `Proyección a ${anios} años: lo probable ${euCorto(pr.p50[n - 1])}, entre ${euCorto(pr.p10[n - 1])} y ${euCorto(pr.p90[n - 1])}`);
  svg.innerHTML = g; cont.appendChild(svg);
  const tt = document.createElement('div'); tt.className = 'tt'; tt.hidden = true; cont.appendChild(tt);
  const cruz = svg.querySelector('.cruz');
  let actual = n - 1;
  const mostrar = (i) => {
    actual = Math.max(0, Math.min(n - 1, i));
    cruz.setAttribute('visibility', 'visible');
    cruz.querySelector('line').setAttribute('x1', x(actual)); cruz.querySelector('line').setAttribute('x2', x(actual));
    cruz.querySelector('circle').setAttribute('cx', x(actual)); cruz.querySelector('circle').setAttribute('cy', y(pr.p50[actual]));
    const d = deIso(pr.fechas[actual]);
    tt.innerHTML = `<b>${euCorto(pr.p50[actual])}</b><span>entre ${euCorto(pr.p10[actual])} y ${euCorto(pr.p90[actual])}</span><span>habrás puesto ${euCorto(pr.aportado[actual])}</span><span>${MESES[d.getMonth()]} ${d.getFullYear()}</span>`;
    tt.hidden = false;
    const px = (x(actual) / W) * cont.clientWidth;
    tt.style.left = Math.min(Math.max(px, 90), cont.clientWidth - 90) + 'px';
    tt.style.top = ((y(pr.p50[actual]) / H) * svg.getBoundingClientRect().height - 12) + 'px';
  };
  const zona = svg.querySelector('.zona');
  zona.addEventListener('pointermove', (ev) => { const r = svg.getBoundingClientRect(); const sx = ((ev.clientX - r.left) / r.width) * W; mostrar(Math.round(((sx - ml) / (W - ml - mr)) * (n - 1))); });
  zona.addEventListener('pointerleave', () => { cruz.setAttribute('visibility', 'hidden'); tt.hidden = true; });
  svg.setAttribute('tabindex', '0');
  svg.addEventListener('keydown', (ev) => { if (ev.key === 'ArrowLeft') { mostrar(actual - 12); ev.preventDefault(); } else if (ev.key === 'ArrowRight') { mostrar(actual + 12); ev.preventDefault(); } });
  svg.addEventListener('focus', () => mostrar(actual));
  svg.addEventListener('blur', () => { cruz.setAttribute('visibility', 'hidden'); tt.hidden = true; });
}

/* =====================================================================
   Ficha de una posición (panel lateral en el PC, pantalla completa en el móvil)
   ===================================================================== */
const FTABS = [['resumen', 'Resumen'], ['expertos', 'Expertos'], ['noticias', 'Noticias'], ['datos', 'Datos']];

function abrirFicha(posId, tab) {
  if (S.ficha) cerrarFicha(true);
  S.ficha = { id: posId, tab: tab || 'resumen' };
  const f = document.createElement('div');
  f.className = 'ficha-fondo'; f.id = 'fichaFondo';
  f.innerHTML = '<div class="ficha" role="dialog" aria-modal="true" aria-labelledby="fichaTit"></div>';
  f.addEventListener('click', (e) => { if (e.target === f) cerrarFicha(); });
  document.body.appendChild(f);
  document.body.style.overflow = 'hidden';
  try { history.pushState({ ficha: posId }, ''); S.fichaHist = true; } catch (e) { S.fichaHist = false; }
  refrescarFicha();
  const b = $('#fichaFondo [data-accion="cerrar-ficha"]'); if (b) b.focus();
}
function cerrarFicha(desdeHistorial) {
  const f = $('#fichaFondo'); if (f) f.remove();
  document.body.style.overflow = '';
  const id = S.ficha && S.ficha.id;
  S.ficha = null;
  if (!desdeHistorial && S.fichaHist) { S.fichaHist = false; try { history.back(); } catch (e) {} }
  const vuelta = id && $(`[data-pos="${CSS.escape(id)}"]`); if (vuelta) vuelta.focus({ preventScroll: true });
}
window.addEventListener('popstate', () => { if (S.ficha) { S.fichaHist = false; cerrarFicha(true); } });

function filaFicha() { return S.ficha && S.M && S.M.filas.find((x) => x.pos.id === S.ficha.id); }
function refrescarFicha() {
  const cont = $('#fichaFondo .ficha'); if (!cont) return;
  const f = filaFicha();
  if (!f) { cerrarFicha(); return; }
  const top = cont.scrollTop;
  cont.innerHTML = htmlFicha(f);
  cont.scrollTop = top;
  dibujarFicha();
}

function htmlFicha(f) {
  const id = f.pos.id, i = f.inst, p = f.p || {};
  const tipo = { 'Acción': 'Acción', 'Fondo indexado': 'Fondo indexado', 'Fondo de renta fija': 'Fondo de renta fija', ETC: 'ETC de oro físico', Cripto: 'Criptomoneda' }[i.tipo] || i.tipo || '';
  let cuerpo = '';
  if (S.ficha.tab === 'resumen') cuerpo = fichaResumen(f);
  else if (S.ficha.tab === 'expertos') cuerpo = fichaExpertos(f);
  else if (S.ficha.tab === 'noticias') cuerpo = `${informeDe(i.id) && informeDe(i.id).novedades ? `<section class="informe"><div class="sec-cab"><h3 style="margin:0;font-size:15px">Lo que dice la prensa, según GrowFolio IA</h3><span class="k">${cabInforme(S.informe)}</span></div>${htmlPrensaIA(informeDe(i.id), false).replace('class="prensa-ia"', 'class="prensa-ia" style="border:0;margin:0;padding:0"')}</section>` : ''}<section>${htmlNoticias(((S.precios && S.precios.noticias) || {})[i.id] || [], false, 20)}<p class="nota">Titulares de Google Noticias de los últimos 30 días.</p></section>`;
  else cuerpo = fichaDatos(f);
  return `<div class="ficha-cab">
    <div class="ficha-tit">${logo(i.dominio, i.corto || i.nombre)}<div><h2 id="fichaTit">${esc(i.corto || i.nombre)}</h2><small title="${esc(donde(i))}">${origen(i)} ${esc(tipo)} en ${esc(f.pos.plataforma || '')}</small>${i.nombre && i.nombre !== i.corto ? `<small>${esc(i.nombre)}</small>` : ''}</div>
      <button class="ib" data-accion="cerrar-ficha" aria-label="Cerrar">${ICONOS.cerrar}</button></div>
    <div class="ficha-precio"><span class="p">${B('pp:' + id)}</span>${B('pd:' + id)}<span class="k">${f.vivo && S.live[i.id] ? `hoy, ${esc(S.live[i.id].fuente)}` : /^Fondo/.test(i.tipo || '') && p.fecha ? `precio del ${fechaCorta(p.fecha)}: los fondos tienen uno al día` : p.fecha ? `cierre del ${fechaCorta(p.fecha)}` : 'hoy'}</span></div>
    <div class="ficha-precio" style="margin-top:-6px;font-size:15px"><span class="k">Tienes</span>${B('pv:' + id, 'valor')}${B('pg:' + id)}${B('pt:' + id)}</div>
    ${(() => { if (i.clase === 'Efectivo') return ''; const tp = tiempoPos(f); return tp ? `<div class="ficha-anual k">Desde hace ${duracion(tp.dias)}: <b class="${cls(tp.anual)}">${pctS(tp.anual, 1)} al año</b> (la bolsa suele dar un ${fmtNum(bolsaAnual(), 0)} %)</div>` : `<div class="ficha-anual k">¿Cuánto ganas al año? <button class="enlace acento" data-accion="editar-pos" data-id="${esc(id)}">Pon desde cuándo la tienes</button></div>`; })()}
    <div class="ficha-botones">
      <button class="btn compra" data-accion="operacion" data-tipo="compra" data-id="${esc(id)}">${ICONOS.compra}Comprar</button>

function dibujarFicha() {
  const g = $('#fichaGraf'); if (!g) return;
  const f = filaFicha(); if (!f) return;
  const dias = RANGOS[S.fichaRango] || 366;
  const pi = INTRADIA.has(S.fichaRango) && S.intra && S.intra.p && S.intra.p[f.inst.id];
  let h;
  if (pi && pi.length > 1) {
    const dia = pi[pi.length - 1][0].slice(0, 10), antes = pi.filter(([t]) => t.slice(0, 10) < dia);
    const lim = S.fichaRango === '1D' ? (antes.length ? antes[antes.length - 1][0] : pi[0][0]) : new Date(Date.now() - 7 * 864e5).toISOString().slice(0, 16) + 'Z';
    h = pi.filter(([t]) => t >= lim).map(([d, v]) => ({ d, v }));
    if (f.precio && h.length) h.push({ d: new Date().toISOString().slice(0, 16) + 'Z', v: f.precio });
  } else {
    const desde = iso(new Date(Date.now() - Math.max(dias, INTRADIA.has(S.fichaRango) ? 9 : 0) * 86400000));
    h = (f.hist || []).filter(([d]) => d >= desde).map(([d, v]) => ({ d, v }));
    if (h.length && f.precio) { const hoy = hoyIso(); if (h[h.length - 1].d === hoy) h[h.length - 1].v = f.precio; else h.push({ d: hoy, v: f.precio }); }
  }
  const cab = $('#fichaCab');
  if (cab && h.length > 1) { const p = (h[h.length - 1].v / h[0].v - 1) * 100; cab.innerHTML = `<span class="${cls(p)}">${pctS(p)}</span><span class="k">${S.fichaRango === '1D' && pi ? 'desde el último cierre' : `desde el ${fechaPunto(h[0].d)}`}</span>`; }
  const medio = f.uds && f.coste ? f.coste / f.uds : null;
  grafLinea(g, [{ datos: h }], { titulo: 'Precio', fmt: (v) => precioFmt(v), ejeFmt: (v) => fmtNum(v, Number.isInteger(v) || v >= 100 ? 0 : 2), cambio: true, alto: 240, linea: medio ? { v: medio, etiqueta: '' } : null });
}

function hoja(titulo, html, alCerrar, ancha) {
  const f = document.createElement('div');
  f.className = 'hoja-fondo';
  f.innerHTML = `<div class="hoja${ancha ? ' ancha' : ''}" role="dialog" aria-modal="true" aria-label="${esc(titulo)}"><div class="hoja-cab"><h2>${esc(titulo)}</h2><button class="ib" data-cerrar aria-label="Cerrar">${ICONOS.cerrar}</button></div>${html}</div>`;
  const cerrar = (sinAviso) => { f.remove(); document.removeEventListener('keydown', tecla, true); if (alCerrar && sinAviso !== true) alCerrar(); };
  const tecla = (e) => { if (e.key === 'Escape') { e.stopPropagation(); cerrar(); } };
  f.addEventListener('click', (e) => { if (e.target === f || e.target.closest('[data-cerrar]')) cerrar(); });
  document.addEventListener('keydown', tecla, true);
  document.body.appendChild(f);
  const primero = f.querySelector('input:not([type=hidden]):not([type=checkbox]), select'); if (primero && window.innerWidth > 720) primero.focus();
  return { el: f, cerrar };
}

}

async function guardarYPintar(mensaje, h) {
  const b = h && h.el.querySelector('button[type=submit]'); if (b) { b.disabled = true; b.textContent = 'Guardando…'; }
  await guardarCartera(mensaje);
  if (h) h.cerrar();
  LIVE.mapas(); LIVE.resuscribir();
  pintar();
  cargarHistCatalogo().then((n) => { if (n) pintar(); });
}

/* ---------- editar o añadir una posición ---------- */
function editarPosicion(id) {
  const orig = id ? S.cartera.posiciones.find((p) => p.id === id) : null;
  const p = orig ? JSON.parse(JSON.stringify(orig)) : { instrumento: S.instOrden[0], plataforma: 'MyInvestor', cantidad: null, fecha: hoyIso(), coste: null };
  const f = orig && S.M ? S.M.filas.find((x) => x.pos.id === id) : null;
  const h = hoja(orig ? `Editar ${(S.inst[p.instrumento] && S.inst[p.instrumento].corto) || ''}` : 'Añadir posición', `
    <form id="fPos" novalidate>
      <div class="form-grid">
        <label class="campo">Instrumento<select name="instrumento">${opcionesInst(p.instrumento)}</select></label>
        <label class="campo">Plataforma<select name="plataforma">${opcionesPlat(p.plataforma)}</select></label>
        <label class="campo">Cantidad<input name="cantidad" inputmode="decimal" value="${val(p.cantidad)}" placeholder="${f && f.uds != null ? 'ahora ' + fmtNum(f.uds, 4) + ' (estimado)' : 'participaciones o acciones'}"><small>Lo que pone tu bróker. Admite coma decimal.</small></label>
        <label class="campo">A fecha de<input name="fecha" type="date" value="${val(p.fecha || hoyIso())}"><small>Las aportaciones automáticas se suman después de esta fecha.</small></label>
        <label class="campo">Invertido (€)<input name="coste" inputmode="decimal" value="${val(p.coste)}"><small>Lo que has puesto en total, con comisiones.</small></label>
        <label class="campo">Desde cuándo la tienes<input name="desde" type="date" value="${val(p.desde || ((p.lotes || [])[0] || {}).f)}"><small>Más o menos, la fecha de tu primera compra. Con ella GrowFolio calcula cuánto ganas al año.</small></label>
      </div>
      <details class="mas"${p.valor_ref || p.stop || p.objetivo || p.entrada || p.notas ? ' open' : ''}><summary>Reglas, apuesta y notas</summary>
        <div class="form-grid">
          <label class="campo">Valor en esa fecha (€)<input name="valor_ref" inputmode="decimal" value="${val(p.valor_ref)}"><small>Solo si no sabes la cantidad: GrowFolio la calcula.</small></label>
          <label class="campo">Salida si baja de (€)<input name="stop" inputmode="decimal" value="${val(p.stop)}"></label>
          <label class="campo">Revisar si llega a (€)<input name="objetivo" inputmode="decimal" value="${val(p.objetivo)}"></label>
          <label class="campo">Fecha de entrada<input name="entrada_fecha" type="date" value="${val(p.entrada && p.entrada.fecha)}"><small>Para compararla con el S&P 500.</small></label>
          <label class="campo">Precio de entrada (€)<input name="entrada_precio" inputmode="decimal" value="${val(p.entrada && p.entrada.precio)}"></label>
        </div>
        <label class="campo" style="margin-top:12px">Notas<textarea name="notas" rows="3">${esc(p.notas || '')}</textarea></label>
      </details>
      <div class="error" id="errPos"></div>
      <div class="fila-btns">${orig ? `<button type="button" class="btn peligro izq" id="bQuitar">${ICONOS.papelera}Quitar posición</button>` : ''}<button type="button" class="btn" data-cerrar>Cancelar</button><button type="submit" class="btn pri">Guardar</button></div>
    </form>`);
  const fm = $('#fPos', h.el);
  const g = (n) => fm.querySelector(`[name="${n}"]`).value;
  fm.querySelector('[name=instrumento]').onchange = (e) => { if (e.target.value === '__nuevo') nuevoInstrumento((nid) => { e.target.innerHTML = opcionesInst(nid || p.instrumento); }); };
  if (orig) dosPasos($('#bQuitar', h.el), 'Pulsa otra vez para quitarla', async () => {
    S.cartera.posiciones = S.cartera.posiciones.filter((x) => x.id !== id);
    if (S.ficha && S.ficha.id === id) cerrarFicha();
    await guardarYPintar('Quitar posición', h);
  });
  fm.onsubmit = async (ev) => {
    ev.preventDefault();
    const err = (t) => { $('#errPos', h.el).textContent = t; };
    const o = { ...p, id: p.id || nuevoId('p-'), instrumento: g('instrumento'), plataforma: g('plataforma'), fecha: g('fecha') || hoyIso() };
    if (o.instrumento === '__nuevo') return err('Elige un instrumento.');
    for (const k of ['cantidad', 'coste', 'valor_ref', 'stop', 'objetivo']) {
      const n = numero(g(k));
      if (Number.isNaN(n)) return err(`"${fm.querySelector(`[name="${k}"]`).closest('label').firstChild.textContent.trim()}" no es un número.`);
      if (n == null) delete o[k]; else o[k] = n;
    }
    if (o.cantidad == null && o.valor_ref == null) return err('Pon la cantidad (o el valor en esa fecha si no la sabes).');
    if (o.cantidad != null) { delete o.valor_ref; if (!orig || orig.cantidad == null || orig.cantidad !== o.cantidad) delete o.estimada; } else o.cantidad = null;
    if (orig && (orig.cantidad !== o.cantidad || +orig.coste !== +o.coste || orig.fecha !== o.fecha)) delete o.lotes;
    if (o.coste == null) o.coste = 0;
    const ef = g('entrada_fecha'), ep = numero(g('entrada_precio'));
    if (ef && ep) o.entrada = { fecha: ef, precio: ep }; else delete o.entrada;
    const de = g('desde'); if (de && de <= hoyIso()) o.desde = de; else delete o.desde;
    const nt = g('notas').trim(); if (nt) o.notas = nt; else delete o.notas;
    if (orig) Object.keys(orig).forEach((k) => delete orig[k]), Object.assign(orig, o);
    else S.cartera.posiciones.push(o);
    await guardarYPintar(orig ? 'Editar posición' : 'Añadir posición', h);
  };
}

/* ---------- registrar una compra o una venta ---------- */
/* Fija en la posición las unidades y el coste de hoy (estimados o con aportaciones ya sumadas)
   para poder sumar o restar la operación encima. */
function fijarPosicion(pos) {
  const f = calcularPos(pos, hoyIso());
  if (f.uds == null) throw new Error('No sé cuántas unidades tienes de esta posición: ponlas en Editar.');
  const sumadas = f.aportes.filter((a) => a.precio);
  const lotes = lotesDe(pos);
  pos.lotes = lotes.map((l) => ({ ...l, u: +l.u.toFixed(8), c: +l.c.toFixed(2) }));
  pos.cantidad = +sum(lotes, (l) => l.u).toFixed(8);
  pos.coste = +sum(lotes, (l) => l.c).toFixed(2);
  if (sumadas.length) pos.fecha = sumadas[sumadas.length - 1].f;
  if (f.estimada) pos.estimada = true;
  delete pos.valor_ref;
}

/* Compra, venta o "ya la tenía" (lo que tienes de antes, sin tocar el efectivo ni el historial).
   Un solo formulario: eliges el modo, buscas la empresa o el fondo y pones cuántas y a qué precio. */
function operacion(tipo, id, sim, cand) {
  let t = ['venta', 'tengo'].includes(tipo) ? tipo : 'compra';
  const instsAntes = new Set(S.instOrden), cambiadosAntes = S.instCambiados;
  let registrada = false;
  const pos0 = id ? S.cartera.posiciones.find((p) => p.id === id) : null;
  let inst = pos0 ? pos0.instrumento : null, plat = pos0 ? pos0.plataforma : null, posSel = pos0;
  if (sim) { const nid = instDeRadar(sim); if (nid) inst = nid; }
  if (cand) { const nid = idDeCandidato(cand); if (nid) inst = nid; }
  const platPor = (iid) => { const i = S.inst[iid] || {}; const ya = S.cartera.posiciones.find((p) => p.instrumento === iid); if (ya) return ya.plataforma; return i.clase === 'Cripto' ? 'Bitvavo' : /^Fondo/.test(i.tipo || '') ? 'MyInvestor' : 'Trade Republic'; };
  if (inst && !plat) plat = platPor(inst);
  const plats = [...new Set([...PLATAFORMAS, ...(S.cartera.posiciones || []).map((p) => p.plataforma), ...(S.cartera.efectivo || []).map((e) => e.plataforma)].filter(Boolean))];
  const h = hoja('Compra, venta o lo que ya tienes', `
    <form id="fOp" novalidate>
      <div class="op-modo" role="group" aria-label="Qué quieres apuntar"><button type="button" data-t="compra">${ICONOS.compra}Compra</button><button type="button" data-t="venta">${ICONOS.venta}Venta</button><button type="button" data-t="tengo">${ICONOS.cartera}Ya la tenía</button></div>
      <p class="op-ayuda" id="opAyuda"></p>
      <div class="op-paso"><span class="op-lbl">Qué</span><div id="opQue"></div></div>
      <div class="op-paso" id="cPlat"><span class="op-lbl">Dónde</span><div class="op-plats" id="opPlat" role="group" aria-label="Plataforma"></div></div>
      <div class="form-grid op-num">
        <label class="campo"><span id="lImp">Cuánto pagaste en total (€)</span><input name="importe" inputmode="decimal" placeholder="por ejemplo, 1.000"><small id="sImp">Sin la comisión.</small></label>
        <label class="campo"><span id="lFecha">Fecha</span><input name="fecha" type="date" value="${hoyIso()}" max="${hoyIso()}"><small id="sFecha"></small></label>
        <label class="campo"><span id="lPrecio">Precio de cada una (€)</span><input name="precio" inputmode="decimal"><small id="sPrecio"></small></label>
        <label class="campo"><span id="lUds">Cuántas</span><input name="uds" inputmode="decimal" placeholder="se calcula sola"><small>Sale sola con el total y el precio; cámbiala si tu bróker dice otra cosa.</small></label>
        <label class="campo" id="cGastos">Comisión (€)<input name="gastos" inputmode="decimal" placeholder="0"><small id="sGastos"></small></label>
      </div>
      <label class="check" id="cEf"><input type="checkbox" name="efectivo"><span id="tEf"></span></label>
      <div class="calculo" id="calc"></div>
      <div class="error" id="errOp"></div>
      <div class="fila-btns"><button type="button" class="btn izq enlace-imp" data-accion="importar">${ICONOS.recorte}Importar desde capturas</button><button type="button" class="btn" data-cerrar>Cancelar</button><button type="submit" class="btn pri" id="bOp">Apuntar</button></div>
    </form>`, () => {
    if (registrada) return;
    const usados = new Set((S.cartera.posiciones || []).map((p) => p.instrumento));
    const sobran = S.instOrden.filter((x) => !instsAntes.has(x) && !usados.has(x));
    if (!sobran.length) return;
    for (const x of sobran) delete S.inst[x];
    S.instOrden = S.instOrden.filter((x) => !sobran.includes(x));
    S.instCambiados = cambiadosAntes;
  });
  const fm = $('#fOp', h.el);
  const q = (n) => fm.querySelector(`[name="${n}"]`);
  const err = (x) => { $('#errOp', h.el).textContent = x; };
  const posDe = () => (t === 'venta' ? posSel : inst && plat ? S.cartera.posiciones.find((p) => p.instrumento === inst && p.plataforma === plat) : null);
  const tasaDe = (instId) => { const i = S.inst[instId] || {}; if (i.bolsa && i.bolsa !== i.pais) return null; const pp = S.precios && S.precios.instrumentos && S.precios.instrumentos[instId]; return tasaCompra(i.pais, i.tipo, pp && pp.fundamentales && pp.fundamentales.capitalizacion); };
  const unidad = () => { const i = S.inst[inst] || {}; return i.tipo === 'Acción' ? 'acciones' : i.clase === 'Cripto' ? 'unidades' : /^Fondo/.test(i.tipo || '') ? 'participaciones' : 'unidades'; };
  // el precio que se propone es el del día de la operación (el de hoy si es hoy); si lo cambias tú, se respeta
  let precioTocado = false, ancla = 'importe', efTocado = false;
  const precioDia = () => {
    if (!inst) return null;
    const fch = q('fecha').value || hoyIso();
    if (fch < hoyIso()) { const h0 = histDe(inst), r = h0 && precioEn(h0, fch, 'antes'); if (r) return r; }
    return precioInst(inst);
  };
  const ponerPrecio = () => { if (t === 'tengo' || precioTocado) return; const pr = precioDia(); if (pr) q('precio').value = String(+pr.toFixed(pr >= 100 ? 2 : 4)).replace('.', ','); recuadrar(); };
  // con el total y el precio salen las participaciones; con las participaciones y el precio, el total
  const recuadrar = () => {
    const pr = numero(q('precio').value);
    if (!(pr > 0)) return;
    if (ancla === 'importe') { const imp = numero(q('importe').value); q('uds').value = imp > 0 ? String(+(imp / pr).toFixed(6)).replace('.', ',') : ''; }
    else { const u = numero(q('uds').value); q('importe').value = u > 0 ? String(+(u * pr).toFixed(2)).replace('.', ',') : ''; }
  };
  const efectivoDe = (pl) => { const e = (S.cartera.efectivo || []).find((x) => x.plataforma === pl); return e ? +e.importe || 0 : 0; };
  const pintarQue = () => {
    const c = $('#opQue', h.el);
    if (t === 'venta') {
      const ps = S.cartera.posiciones.filter((p) => calcularPos(p, hoyIso()).uds > 0);
      c.innerHTML = ps.length ? `<div class="op-lista">${ps.map((p) => { const i = S.inst[p.instrumento] || { corto: p.instrumento }; const f = calcularPos(p, hoyIso()); return `<button type="button" class="op-pos" data-pid="${esc(p.id)}" aria-pressed="${posSel && posSel.id === p.id}">${logo(i.dominio, i.corto || i.nombre)}<span><b>${esc(i.corto || i.nombre)}</b><small>${esc(p.plataforma || '')}, ${oc(fmtNum(f.uds, f.uds < 10 ? 4 : 2))} ${/^Fondo/.test(i.tipo || '') ? 'participaciones' : i.clase === 'Cripto' ? (i.corto || '') : i.tipo === 'Acción' ? (f.uds === 1 ? 'acción' : 'acciones') : 'unidades'}</small></span></button>`; }).join('')}</div>` : '<div class="vacio">No tienes nada que vender todavía.</div>';
      for (const b of $$('[data-pid]', c)) b.onclick = () => { posSel = S.cartera.posiciones.find((p) => p.id === b.dataset.pid); inst = posSel.instrumento; plat = posSel.plataforma; precioTocado = false; ponerPrecio(); pintarTodo(); };
      return;
    }
    if (inst) {
      const i = S.inst[inst] || {}, pr = precioInst(inst), ya = S.cartera.posiciones.filter((p) => p.instrumento === inst);
      c.innerHTML = `<div class="op-elegido">${logo(i.dominio, i.corto || i.nombre)}<span class="busca-t"><b>${esc(i.corto || i.nombre)}</b><small>${chipCotiza(i)}${i.yahoo ? ` · ${esc(i.yahoo)}` : ''}${ya.length ? ` · ya tienes en ${esc(ya.map((p) => p.plataforma).join(' y '))}` : ''}</small></span><span class="busca-p">${pr ? precioFmt(pr) : ''}</span><button type="button" class="enlace acento" id="opCambiar">Cambiar</button></div>`;
      $('#opCambiar', h.el).onclick = () => { inst = null; pintarTodo(); };
    } else buscador(c, (nid) => {
      inst = nid; plat = platPor(nid); precioTocado = false;
      if (!q('gastos').dataset.tocado) q('gastos').value = plat === 'Trade Republic' && t !== 'tengo' ? '1' : '';
      ponerPrecio(); pintarTodo(); setTimeout(() => q('importe').focus(), 50);
    }, { foco: true });
  };
  const pintarPlat = () => {
    const c = $('#opPlat', h.el);
    if (t === 'venta') { $('#cPlat', h.el).hidden = true; return; }
    $('#cPlat', h.el).hidden = false;
    c.innerHTML = plats.map((p) => `<button type="button" data-plat="${esc(p)}" aria-pressed="${plat === p}">${esc(p)}</button>`).join('') + '<button type="button" data-plat="__otra">Otra…</button>';
    for (const b of $$('[data-plat]', c)) b.onclick = () => {
      if (b.dataset.plat === '__otra') { const n = (prompt('¿Cómo se llama la plataforma?') || '').trim(); if (!n) return; if (!plats.includes(n)) plats.push(n); plat = n; } else plat = b.dataset.plat;
      if (!q('gastos').dataset.tocado) q('gastos').value = plat === 'Trade Republic' && t !== 'tengo' ? '1' : '';
      pintarTodo();
    };
  };
  const recalcular = () => {
    const uds = numero(q('uds').value), pr = numero(q('precio').value), gastos = t === 'tengo' ? 0 : numero(q('gastos').value) || 0;
    const c = $('#calc', h.el);
    if (!inst) { c.innerHTML = '<div><span class="k">Elige primero qué.</span></div>'; return; }
    if (!(uds > 0) || !(pr > 0)) { c.innerHTML = `<div><span class="k">${t === 'tengo' ? 'Pon cuántas tienes y tu precio medio (o lo invertido).' : 'Pon cuántas y el precio (o el importe).'}</span></div>`; return; }
    const bruto = uds * pr;
    // ¿cuadra el precio con lo que valía ese día? Si no, casi seguro que es otro fondo u otra clase
    const h0 = histDe(inst), fch = q('fecha').value || hoyIso(), real = h0 && fch < hoyIso() ? precioEn(h0, fch, 'antes') : null;
    const raro = real && (pr / real > 1.25 || pr / real < 0.8) ? `<div class="op-raro">${ICONOS.alerta}<span>El ${fechaLarga(fch)} ${esc((S.inst[inst] || {}).nombre || '')} valía ${precioFmt(real)} y tú pones ${precioFmt(pr)}. Si no cuadra, seguramente el tuyo es otro fondo u otra clase: búscalo por su ISIN (sale en tu bróker).</span></div>` : '';
    if (t === 'tengo') {
      const ahora = precioInst(inst), vale = ahora ? uds * ahora : null, g = vale != null ? vale - bruto : null;
      c.innerHTML = `${raro}<div><span>Invertido</span><span>${eur(bruto)}</span></div>${vale != null ? `<div><span>Vale hoy</span><span>${eur(vale)}</span></div><div><b>${g >= 0 ? 'Llevas ganado' : 'Llevas perdido'}</b><b class="${cls(g)}">${eurS(g)} (${pctS((g / bruto) * 100, 1)})</b></div>` : ''}`;
      return;
    }
    if (t === 'compra') {
      const ta = tasaDe(inst); const tasa = ta ? bruto * ta.tipo : 0;
      c.innerHTML = `${raro}<div><span>Importe</span><span>${eur(bruto)}</span></div><div><span>Comisión</span><span>${eur(gastos)}</span></div>${ta ? `<div><span>Tasa de compra (${fmtNum(ta.tipo * 100, 1)} %, ${esc(ta.nombre)})</span><span>${eur(tasa)}</span></div>` : ''}<div><b>Total pagado</b><b>${eur(bruto + gastos + tasa)}</b></div>`;
      return;
    }
    const p = posSel; let extra = '';
    if (p) {
      try {
        const copia = JSON.parse(JSON.stringify(p)); fijarPosicion(copia);
        const r = fifo(copia.lotes, Math.min(uds, copia.cantidad));
        const res = bruto - gastos - r.coste;
        const imp = res > 0 ? impuestoDeVenta(res).impuesto : 0;
        extra = `<div><span>Lo que te costaron (FIFO)</span><span>${eur(r.coste)}</span></div><div><b>${res >= 0 ? 'Ganas' : 'Pierdes'}</b><b class="${cls(res)}">${eurS(res)}</b></div>${res > 0 ? `<div><span>Impuesto estimado en la renta</span><span>${eur(imp)}</span></div>` : res < 0 ? `<div><span class="k">Esa pérdida resta de tus ganancias del año (y si sobra, de los 4 siguientes).${(() => { const ins = S.inst[copia.instrumento], l = libreRecompra(ins, q('fecha').value || hoyIso()); return l ? ` Para que cuente, no la recompres hasta el ${fechaLarga(l)}: es la regla de ${reglaRecompra(ins).plazo} de Hacienda.` : ''; })()}</span></div>` : ''}${uds > copia.cantidad + 1e-6 ? '<div><span class="down">Vendes más de lo que tienes.</span></div>' : ''}`;
      } catch (e) { extra = `<div><span class="down">${esc(e.message)}</span></div>`; }
    }
    c.innerHTML = `<div><span>Importe</span><span>${eur(bruto)}</span></div><div><span>Comisión</span><span>${eur(gastos)}</span></div><div><b>Cobras</b><b>${eur(bruto - gastos)}</b></div>${extra}`;
  };
  const pintarTodo = () => {
    for (const b of $$('[data-t]', fm)) b.setAttribute('aria-pressed', b.dataset.t === t);
    const tengo = t === 'tengo';
    $('#opAyuda', h.el).textContent = t === 'compra' ? 'Una compra que acabas de hacer: suma a tu posición y, si quieres, resta del efectivo.' : t === 'venta' ? 'Elige qué vendiste: GrowFolio calcula lo que ganas o pierdes para Hacienda.' : 'Lo que ya tenías antes de usar GrowFolio: pon cuántas tienes y tu precio medio (sale en tu bróker). No toca el efectivo ni el historial.';
    $('#lUds', h.el).textContent = `Cuántas ${inst ? unidad() : ''}${tengo ? ' tienes' : t === 'venta' ? ' vendiste' : ''}`.replace(/\s+/g, ' ');
    $('#lPrecio', h.el).textContent = tengo ? 'Tu precio medio (€)' : 'Precio de cada una (€)';
    $('#sPrecio', h.el).textContent = tengo ? 'Sale en tu bróker. Si pones lo invertido y cuántas, no hace falta.' : 'El de ese día. Si tu justificante dice otro, cámbialo.';
    $('#lImp', h.el).textContent = tengo ? 'Lo invertido en total (€)' : t === 'venta' ? 'Cuánto cobraste en total (€)' : 'Cuánto pagaste en total (€)';
    $('#sImp', h.el).textContent = tengo ? 'Lo que pagaste por todas: sale en tu bróker.' : 'Sin la comisión.';
    // la fecha también es "desde cuándo la tienes": con ella sale cuánto te da al año, así que se pide ya aquí
    $('#lFecha', h.el).textContent = tengo ? 'Desde cuándo la tienes (más o menos)' : t === 'venta' ? 'Cuándo la vendiste' : 'Cuándo la compraste';
    $('#sFecha', h.el).textContent = tengo ? 'El día de tu primera compra, más o menos. Con él GrowFolio calcula cuánto te da al año.' : t === 'venta' ? 'Cuenta para la renta de ese año.' : 'Si es de hace tiempo, pon ese día: el precio y lo que te da al año salen solos.';
    if (!efTocado) q('efectivo').checked = !tengo && !!plat && (t === 'venta' || efectivoDe(plat) > 0);
    $('#cGastos', h.el).hidden = tengo; $('#cEf', h.el).hidden = tengo;

    };

    for (const e of efectivo.filter((x) => x.ok)) {
      S.cartera.efectivo = S.cartera.efectivo || [];
      const ya = S.cartera.efectivo.find((x) => x.plataforma === e.plat);
      if (ya) ya.importe = e.importe; else S.cartera.efectivo.push({ plataforma: e.plat, importe: e.importe });
      n++;
    }
    if (!n) { estado('No hay nada marcado para guardar.', true); return; }
    hecho = true;
    await guardarYPintar('Importar desde capturas', h);
    toast(`Listo: ${n} ${n === 1 ? 'cosa añadida' : 'cosas añadidas'}. Pon en cada ficha desde cuándo la tienes para ver cuánto te da al año.`, 6000);
  };
  $('#impArch', h.el).onchange = async (ev) => {
    const files = [...ev.target.files].slice(0, 8);
    if (!files.length) return;
    try {
      estado(`Preparando ${files.length} ${files.length === 1 ? 'archivo' : 'archivos'}…`);
      const arch = await Promise.all(files.map(leerArchivo));
      if (arch.reduce((a, x) => a + x.data.length, 0) > 18e6) throw new Error('Pesan demasiado: sube menos capturas o un PDF más pequeño.');
      const o = await leerCapturas(arch, estado);
      const platGen = PLATAFORMAS.find((p) => normTxt(o.plataforma || '').includes(normTxt(p))) || (o.plataforma || null);
      filas = (o.posiciones || []).filter((x) => x && (x.nombre || x.isin)).map((x) => {
        const m = emparejar(x);
        const platX = PLATAFORMAS.find((p) => normTxt(x.plataforma || '').includes(normTxt(p))) || x.plataforma || platGen;
        const i = m && S.inst[m.id];
        const plat = platX || (i ? (i.clase === 'Cripto' ? 'Bitvavo' : /^Fondo/.test(i.tipo || '') ? 'MyInvestor' : 'Trade Republic') : 'Trade Republic');
        const uds = +x.cantidad > 0 ? +x.cantidad : null;
        const inv = +x.invertido > 0 ? +x.invertido : uds && +x.precio_medio > 0 ? uds * +x.precio_medio : null;
        return { x, id: m ? m.id : null, como: m ? m.como : null, ok: !!m, plat, uds, inv };
      });
      efectivo = (o.efectivo || []).filter((e) => e && +e.importe > 0).map((e) => ({ plat: PLATAFORMAS.find((p) => normTxt(e.plataforma || '').includes(normTxt(p))) || e.plataforma || platGen || 'Trade Republic', importe: +e.importe, ok: true }));
      estado(filas.length || efectivo.length ? `He encontrado ${filas.length} ${filas.length === 1 ? 'posición' : 'posiciones'}${efectivo.length ? ' y efectivo' : ''}.` : 'No he encontrado posiciones en esas imágenes. Prueba con la pantalla donde se ven todas tus inversiones.', !(filas.length || efectivo.length));
      pintarRev();
    } catch (e) { estado(e.message, true); }
    ev.target.value = '';
  };
}

/* =====================================================================
   Cartera desde un archivo: vale la copia de la web tal cual o un JSON sencillo, con el ISIN, el ticker o
   el nombre de cada cosa en vez del id interno. La web busca cada valor (lo tuyo, el catálogo, el radar,
   cripto) y lo que no reconoce lo deja fuera y lo dice.
   ===================================================================== */
const EJEMPLO_CARTERA = {
  posiciones: [
    { isin: 'IE00BYX5MX67', nombre: 'Fidelity S&P 500 Index Fund EUR P Acc', plataforma: 'MyInvestor', cantidad: 63.77551, coste: 1000, fecha: '2026-05-15' },
    { ticker: 'AAPL', plataforma: 'Trade Republic', cantidad: 2, precio_medio: 210.5, fecha: '2026-03-02' },
    { nombre: 'Bitcoin', plataforma: 'Bitvavo', cantidad: 0.01, coste: 600 },
  ],
  efectivo: [{ plataforma: 'Trade Republic', importe: 250 }],
};
function normalizarCartera(j) {
  if (Array.isArray(j)) j = { posiciones: j };
  if (!j || !Array.isArray(j.posiciones)) throw new Error('Falta la lista "posiciones".');
  for (const i of j.inst_propios || []) if (i && i.id && !S.inst[i.id]) { S.inst[i.id] = i; S.instOrden.push(i.id); }
  const n = (v) => { if (v == null || v === '') return null; const x = typeof v === 'number' ? v : numero(v); return isFinite(x) ? x : null; };
  const fechaOk = (f) => (/^\d{4}-\d{2}-\d{2}$/.test(String(f || '')) ? String(f) : /^\d{1,2}\/\d{1,2}\/\d{4}$/.test(String(f || '')) ? String(f).split('/').reverse().map((x) => x.padStart(2, '0')).join('-') : null);
  const posiciones = [], fuera = [];
  for (const x of j.posiciones) {
    if (!x || typeof x !== 'object') continue;
    let id = x.instrumento && S.inst[x.instrumento] ? x.instrumento : null;
    if (!id) {
      const m = emparejar({ isin: x.isin, ticker: x.ticker || x.simbolo, nombre: x.nombre || x.instrumento || '', tipo: x.tipo });
      id = m && m.id;
    }
    if (!id) { fuera.push(x.nombre || x.isin || x.ticker || x.instrumento || '¿?'); continue; }
    const uds = n(x.cantidad ?? x.participaciones ?? x.acciones ?? x.unidades ?? x.uds);
    const pm = n(x.precio_medio ?? x.precio);
    let coste = n(x.coste ?? x.invertido ?? x.importe ?? x.total);
    if (coste == null && uds != null && pm != null) coste = +(uds * pm).toFixed(2);
    if (uds == null && coste == null) { fuera.push((x.nombre || x.isin || x.ticker || id) + ' (sin cantidad ni importe)'); continue; }
    const f = fechaOk(x.fecha ?? x.fecha_compra ?? x.desde);
    const pos = { ...x, id: x.id || nuevoId('p-'), instrumento: id, plataforma: x.plataforma || x.broker || 'Otra', cantidad: uds, coste: coste ?? 0, fecha: fechaOk(x.fecha) || hoyIso() };
    for (const k of ['isin', 'ticker', 'simbolo', 'nombre', 'participaciones', 'acciones', 'unidades', 'uds', 'precio_medio', 'precio', 'invertido', 'importe', 'total', 'broker', 'fecha_compra', 'tipo']) delete pos[k];
    if (f && !x.lotes) { pos.desde = f; pos.fecha = f; if (uds) pos.lotes = [{ f, u: uds, c: coste ?? 0 }]; }
    posiciones.push(pos);
  }
  let efectivo = j.efectivo || [];
  if (!Array.isArray(efectivo)) efectivo = Object.entries(efectivo).map(([plataforma, importe]) => ({ plataforma, importe }));
  efectivo = efectivo.map((e) => ({ plataforma: e.plataforma || e.broker || 'Otra', importe: n(e.importe) || 0 })).filter((e) => e.importe);
  const cartera = { version: 1, aportaciones: [], limite_acciones: 20, ...j, posiciones, efectivo };
  return { cartera, fuera };
}
const resumenImport = (r) => `${r.cartera.posiciones.length} posiciones${r.cartera.efectivo.length ? ` y efectivo en ${r.cartera.efectivo.length} sitio${r.cartera.efectivo.length > 1 ? 's' : ''}` : ''}.${r.fuera.length ? ` No reconozco ${r.fuera.length}: ${r.fuera.slice(0, 4).join(', ')}${r.fuera.length > 4 ? '…' : ''}. Añádelas luego a mano o pon su ISIN en el archivo.` : ' Todo reconocido.'}`;

/* las empresas que da de alta alguien sin GitHub van dentro de su cartera cifrada (no en instrumentos.json) */
function instPropios() {
  const comunes = new Set(((S.instJson && S.instJson.instrumentos) || []).map((i) => i.id));
  return S.instOrden.filter((id) => !comunes.has(id)).map((id) => S.inst[id]);
}
function sumarInstPropios() {
  for (const i of (S.cartera && S.cartera.inst_propios) || []) {
    if (!i || !i.id) continue;
    // si el dueño de la web la ha añadido a la lista común (con precio diario de la Action), se usa esa
    const comun = S.instOrden.find((id) => { const c = S.inst[id]; return id !== i.id && c && ((i.isin && c.isin === i.isin) || (i.yahoo && c.yahoo && c.yahoo.toUpperCase() === i.yahoo.toUpperCase())); });
    if (comun) {
      for (const lista of [S.cartera.posiciones, S.cartera.aportaciones, S.cartera.movimientos]) for (const x of lista || []) if (x.instrumento === i.id) x.instrumento = comun;
      continue;
    }
    if (!S.inst[i.id]) { S.inst[i.id] = i; S.instOrden.push(i.id); }
  }
}
async function guardarLocal() {
  S.cartera.inst_propios = instPropios();
  S.cartera.actualizado = new Date().toISOString();
  const texto = await cifrar(S.cartera);
  if (PERFIL_CUENTA) {
    // primero en el dispositivo y luego a la cuenta; si no hay conexión, se sube al volver a entrar
    cacheCuenta.set(texto, S.cartera.actualizado); S.enc = { texto, sha: null }; S.instCambiados = false;
    try { await fbCargar(); if (!FB.user) throw new Error('sin sesión'); await escribirCuenta(texto); LS.del('inv-pend-cuenta'); S.cuentaOk = true; }
    catch (e) { console.warn('No se pudo subir a la cuenta', e); LS.set('inv-pend-cuenta', true); S.cuentaOk = false; }
    return true;
  }
  LS.set('inv-local-enc', texto); S.enc = { texto, sha: null }; S.instCambiados = false;
  try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (e) {}
  return true;
}
async function guardarCartera(mensaje) {

// palabras que la gente escribe de otra forma que el nombre del fondo
const SINONIMOS_BUSCA = { indexado: 'index', indice: 'index', mundial: 'world', mundo: 'world', emergentes: 'emerging', europa: 'europe', oro: 'gold', japon: 'japan', tecnologia: 'technology', tecnologicas: 'technology', bonos: 'bond', dividendos: 'dividend' };
function buscarEn(lista, q) {
  const t = normTxt(q), T = t.replace(/ /g, '');
  if (!t) return [];
  const sc = (c) => {
    const n = normTxt(c.n), l = normTxt(c.l), s = String(c.s || '').toLowerCase(), base = s.split('.')[0].split('-')[0], isin = String(c.isin || '').toLowerCase();
    if (isin && isin === T) return 100;
    if (base === T || s === T || (c.a || []).some((x) => String(x).toLowerCase() === T)) return 90;
    if (n === t) return 85;
    if (n.startsWith(t) || l.startsWith(t)) return 70;
    if (T.length >= 2 && base.startsWith(T)) return 55;
    if ((' ' + n + ' ' + l).includes(' ' + t)) return 50;
    // "SP500", "sp 500" o "S&P500" tienen que encontrar el "S&P 500": se compara también sin espacios
    const nC = n.replace(/ /g, ''), lC = l.replace(/ /g, '');
    if (T.length >= 3 && (nC.startsWith(T) || lC.startsWith(T))) return 48;
    if (t.length >= 3 && (n.includes(t) || l.includes(t))) return 35;
    if (T.length >= 4 && (nC.includes(T) || lC.includes(T))) return 33;

    const ws = t.split(' ').filter((w) => w.length >= 2).map((w) => SINONIMOS_BUSCA[w] || w);
    if (ws.length > 1 && ws.every((w) => todo.includes(w) || todoC.includes(w))) return 30;
    return 0;

}

/* sin histórico (empresas del radar): dónde está el precio dentro de su rango del año y su objetivo */
function rangoConsulta(x) {
  if (!(x.mx > x.mn) || !x.p) return '';
  const p = (v) => Math.max(0, Math.min(100, ((v - x.mn) / (x.mx - x.mn)) * 100)).toFixed(1);
  return `<div class="cons-rango"><div class="cr-t"><span class="k">Rango del último año</span>${x.c1a != null ? `<b class="${cls(x.c1a)}">${pctS(x.c1a, 1)} en un año</b>` : ''}</div>
    <div class="cr-barra" role="img" aria-label="Precio ${precioR(x.p, x.m)} entre ${precioR(x.mn, x.m)} y ${precioR(x.mx, x.m)}"><i class="cr-p" style="left:${p(x.p)}%"></i>${x.obj ? `<i class="cr-o" style="left:${p(Math.min(x.obj, x.mx))}%" title="Objetivo medio de los analistas"></i>` : ''}</div>
    <div class="cr-et"><span>${precioR(x.mn, x.m)}</span>${x.obj ? `<span class="cr-leg"><i></i>objetivo ${precioR(x.obj, x.m)}</span>` : ''}<span>${precioR(x.mx, x.m)}</span></div></div>`;
}
function abrirConsulta(c) {
  if (!c) return;
  if (c.k.startsWith('merc:')) {
    const d = document.querySelector(`details.mfila[data-sym="${CSS.escape(c.k.slice(5))}"]`);
    if (d) { d.open = true; d.scrollIntoView({ behavior: 'smooth', block: 'center' }); }
    return;
  }
  const idI = c.k.startsWith('inst:') ? c.k.slice(5) : null;
  const pos = idI && (S.cartera.posiciones || []).find((p) => p.instrumento === idI);
  if (pos) { abrirFicha(pos.id); return; }
  const inst = idI ? S.inst[idI] : null;
  const cid = c.k.startsWith('cat:') ? c.k.slice(4) : (inst && inst.cat) || null;
  const ca = cid ? S.cat && S.cat.v && S.cat.v[cid] : inst ? catDe(inst) : null;
  const sim = c.k.startsWith('radar:') ? c.k.slice(6) : c.s || (inst && inst.yahoo) || '';
  const x = sim ? radarPorSim(sim) : null;
  const pi = idI && S.precios && S.precios.instrumentos && S.precios.instrumentos[idI];
  let precio = null, mon = 'EUR', dia = null, fecha = null;
  if (idI && pi && pi.precio) { precio = precioInst(idI); dia = pi.variacion_dia; fecha = pi.fecha; mon = pi.moneda || 'EUR'; }
  if (precio == null && ca && ca.p) { precio = ca.p; mon = ca.m || 'EUR'; dia = ca.pa ? (ca.p / ca.pa - 1) * 100 : null; fecha = ca.f; }
  if (precio == null && x) { precio = x.p; mon = x.m || 'EUR'; dia = x.v; }
  const nombre = x && c.k.startsWith('radar:') ? nombreRadar(x) : c.n;
  const fondo = /^Fondo/.test((ca && ca.t) || (inst && inst.tipo) || '');
  const datos = [];
  if (x) {
    if (x.na) datos.push(['Analistas', `${fmtNum(x.na, 0)}, ${esc((CONSENSO[x.r] || '').toLowerCase() || 'sin consenso')}`]);
    if (x.pot != null && x.obj) datos.push(['Hasta su precio objetivo', `<span class="${cls(x.pot)}">${pctS(x.pot, 1)}</span> (${precioR(x.obj, x.m)})`]);
    if (x.div) datos.push(['Dividendo', pct(x.div, 1)]);
    if (x.perf) datos.push(['PER futuro', fmtNum(x.perf, 1)]);
    // la capitalización llega en la moneda de la bolsa: se pasa a euros con el cambio del día
    const fxC = x.m === 'EUR' ? 1 : (S.precios && S.precios.fx && S.precios.fx[x.m === 'GBp' ? 'GBP' : x.m]) || null;
    if (x.cap && fxC) datos.push(['Capitalización', capital(x.cap * fxC)]);
    if (x.sector) datos.push(['Sector', esc(x.sector)]);
    if (x.z) datos.push(['País', esc(x.z)]);
  }
  if (ca && ca.r && Object.keys(ca.r).length > 1) datos.push(['Dónde invierte', esc(Object.entries(ca.r).sort((a, b) => b[1] - a[1]).map(([k, v]) => `${k} ${fmtNum(v, 0)} %`).join(', '))]);
  const nots = sim ? noticiasIdea(sim) : [];
  const gnews = `https://news.google.com/search?q=${encodeURIComponent(nombre)}&hl=es&gl=ES&ceid=ES:es`;
  const h = hoja(nombre, `<div class="cons">
      <div class="cons-cab">${logo(c.dom, nombre)}<div class="busca-t"><b>${esc(nombre)}</b><small>${bandera(c.cot.cod)}${esc(c.cot.txt || '')}${c.isin ? ` · ${esc(c.isin)}` : sim ? ` · ${esc(sim)}` : ''}</small></div></div>
      ${precio != null ? `<div class="cons-precio"><b>${precioR(precio, mon)}</b>${dia != null ? `<span class="${cls(dia)}">${pctS(dia, 2)}</span>` : ''}<small class="k">${fecha ? `${fondo ? 'valor liquidativo del' : 'cierre del'} ${fechaCorta(fecha)}` : 'último cierre'}</small></div>` : ''}
      <div id="consGraf">${cid || (idI && histDe(idI)) ? '<div class="vacio">Cargando la gráfica…</div>' : x ? rangoConsulta(x) : ''}</div>
      <div class="fila-btns cons-btns"><button type="button" class="btn pri" data-cons-add>${ICONOS.mas}Añadir a mi cartera</button><button type="button" class="btn" data-cons-ia>${ICONOS.chispa}Pregúntale a la IA</button></div>
      ${datos.length ? `<dl class="kv">${datos.map(([k, v]) => `<dt>${k}</dt><dd>${v}</dd>`).join('')}</dl>` : ''}
      ${x ? `<details class="mas"><summary>Las siete señales de GrowFolio</summary>${htmlContrasteLista(contraste(x))}</details>` : ''}
      <section class="cons-not"><h3>Noticias</h3>${nots.length ? htmlNoticias(nots, false, 5) : ''}<a class="enlace" href="${esc(gnews)}" target="_blank" rel="noopener noreferrer">Ver las noticias de ${esc(nombre)} en Google Noticias</a></section>
    </div>`);
  $('[data-cons-add]', h.el).onclick = () => { h.cerrar(); operacion('compra', null, null, c); };
  $('[data-cons-ia]', h.el).onclick = () => { h.cerrar(); abrirAsesor(`¿Qué me dices de ${nombre}${sim ? ` (${sim})` : c.isin ? ` (${c.isin})` : ''}? Qué es, cómo le va, qué riesgos tiene y si encajaría en mi cartera.`); };
  // la gráfica: histórico del catálogo (fondos y cripto) o el de la web; si no hay, el rango del año
  const gr = $('#consGraf', h.el);
  (async () => {
    let serie = idI ? histDe(idI) : null;
    if (!serie && cid) {
      const id2 = cid;
      try { const r = await fetch(CFG.dev ? `dev/cat/${id2}.json` : GH.raw(`cat/${id2}.json`, 'catalogo') + '?v=' + Math.floor(Date.now() / 3600000), { cache: 'no-cache' }); if (r.ok) { const j = await r.json(); serie = j && j.h; } } catch (e) { console.warn(e); }
    }
    const g = serie ? graficaConsulta(serie, mon) : '';
    gr.innerHTML = g || (x ? rangoConsulta(x) : '');
  })();
}

});

/* qué se ha mejorado: lo nuevo arriba, cada cosa con un «Enséñamelo» que te lleva hasta ella resaltada (como el
   tutorial) y un «Enséñamelo todo» que las recorre en orden. Las versiones anteriores, plegadas una a una con sus
   dibujos y sus textos. */
function mostrarNovedades(desde, alCerrar) {
  LS.set('inv-version', VERSION); LS.set('inv-vnum', 2);
  let nuevas = NOVEDADES.filter((n) => n.cosas && desde && cmpVer(n.v, desde) > 0);
  if (!nuevas.length) nuevas = [NOVEDADES[0]];
  const resto = NOVEDADES.filter((n) => !nuevas.includes(n));
  const pasos = [], idx = new Map();
  for (const n of nuevas) for (const c of n.cosas || []) if (c.ir) { idx.set(c, pasos.length); pasos.push({ ...c.ir, t: c.t, x: c.x, dib: c.d, nuevo: n.v }); }
  const item = (c, i, ir) => `<li style="--i:${i}">${dibujo(c.d)}<div><b>${esc(c.t)}</b><p>${esc(c.x)}</p>${ir && idx.has(c) ? `<button type="button" class="enlace nov-ir" data-nov-ir="${idx.get(c)}">Enséñamelo</button>` : ''}</div></li>`;
  const bloque = (n) => `<section class="nov-v">
    <div class="nov-cab"><span class="nov-num">${esc(n.v)}</span><span class="nov-alfa">alfa</span><small>${fechaNov(n.f, n.h)}</small></div>
    <h3>${esc(n.t)}</h3>
    <ul class="nov-lista">${(n.cosas || []).map((c, i) => item(c, i, true)).join('')}</ul>
  </section>`;
  const antes = (n) => `<details class="nov-ant"><summary><span class="nov-num peq">${esc(n.v)}</span><span class="nov-ant-t"><b>${esc(n.t)}</b><small>${fechaNov(n.f, n.h)}</small></span></summary>${n.cosas ? `<ul class="nov-lista">${n.cosas.map((c, i) => item(c, i, false)).join('')}</ul>` : ''}</details>`;
  // si llevabas tiempo sin entrar, salen todas las que te has perdido, enteras, de la más nueva a la más antigua
  const perdidas = nuevas.length > 1 ? `<p class="nov-perdidas">${dibujo('tour')}<span><b>Te has perdido ${nuevas.length} actualizaciones</b>Desde la ${esc(desde)}, que fue la última que viste. Aquí van todas, de la más nueva a la más antigua.</span></p>` : '';
  const h = hoja(nuevas.length > 1 ? 'Lo que te has perdido' : '¿Qué se ha mejorado?', `<div class="novedades">${perdidas}${nuevas.map(bloque).join('')}
    ${pasos.length ? `<button type="button" class="btn pri nov-todo" data-nov-todo>${ICONOS.chispa}Enséñamelo todo, paso a paso</button>` : ''}
    ${resto.length ? `<section class="nov-antes" aria-labelledby="hNovAnt"><h3 id="hNovAnt">Versiones anteriores</h3>${resto.map(antes).join('')}</section>` : ''}
    <button type="button" class="enlace nov-reg" data-nov-reg>Registro de cambios completo, en texto y sin dibujos</button>
    <div class="fila-btns"><button class="btn" data-tour-ya>Ver el tutorial</button><button class="btn" data-cerrar>Cerrar</button></div>
  </div>`, alCerrar);
  h.el.classList.add('hoja-nov');
  $('[data-nov-reg]', h.el).onclick = () => { h.cerrar(true); abrirRegistro(alCerrar); };
  const ir = (k) => { h.cerrar(true); iniciarTour(k, alCerrar, pasos); };
  $('[data-tour-ya]', h.el).onclick = () => { h.cerrar(true); iniciarTour(0, alCerrar); };
  if (pasos.length) $('[data-nov-todo]', h.el).onclick = () => ir(0);
  for (const b of $$('[data-nov-ir]', h.el)) b.onclick = () => ir(+b.dataset.novIr);
}
