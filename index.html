];
let TOURE = null;
const elVisible = (sel) => { if (!sel) return null; for (const el of document.querySelectorAll(sel)) { const r = el.getBoundingClientRect(); if (r.width && r.height) return el; } return null; };
function iniciarTour(paso = 0, alAcabar, pasos) {
  cerrarTour();
  if (S.ficha) cerrarFicha(true);
  document.querySelectorAll('.hoja-fondo').forEach((x) => x.remove());
  const capa = document.createElement('div');
  capa.className = 'tour'; capa.setAttribute('role', 'dialog'); capa.setAttribute('aria-modal', 'true'); capa.setAttribute('aria-label', 'Tour por la app');
  capa.innerHTML = '<div class="tour-foco"></div><div class="tour-caja" tabindex="-1" aria-live="polite"></div>';
  document.body.appendChild(capa);
  const reubicar = () => colocarTour();
  const tecla = (e) => {
    if (e.key === 'Escape') { e.stopPropagation(); cerrarTour(true); }
    else if (e.key === 'ArrowRight') irPasoTour(1);
    else if (e.key === 'ArrowLeft') irPasoTour(-1);
  };
  window.addEventListener('resize', reubicar); window.addEventListener('scroll', reubicar, true); document.addEventListener('keydown', tecla, true);
  TOURE = { capa, i: paso, el: null, alAcabar, pasos: pasos || TOUR, nov: !!pasos, off: () => { window.removeEventListener('resize', reubicar); window.removeEventListener('scroll', reubicar, true); document.removeEventListener('keydown', tecla, true); } };
  // en el móvil, deslizar la tarjeta pasa de paso
  let x0 = null, y0 = null;
  capa.addEventListener('touchstart', (e) => { if (!e.target.closest('.tour-caja')) return; x0 = e.touches[0].clientX; y0 = e.touches[0].clientY; }, { passive: true });
  capa.addEventListener('touchend', (e) => {
    if (x0 == null) return;
    const dx = e.changedTouches[0].clientX - x0, dy = e.changedTouches[0].clientY - y0; x0 = null;
    if (Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy) * 1.5) irPasoTour(dx < 0 ? 1 : -1);
  }, { passive: true });
  capa.addEventListener('click', (e) => {
    const b = e.target.closest('[data-t]'); if (!b) return;

function contarGTA(el) {
  const to = +el.dataset.to, fm = el.dataset.f, fin = el.dataset.fin || el.textContent;
  if (!isFinite(to)) return;
  const desde = fm === 'anio' ? new Date().getFullYear() : 0;
  const fmt = (x) => (fm === 'anio' ? 'Año ' + Math.round(x) : fm === 'signo' ? (x >= 0 ? '+' : '−') + nGTA(Math.abs(x)) : fm === 'anos' ? nGTA(x, x < 10 ? 1 : 0) + (x < 2 ? ' año' : ' años') : fm === 'eur' ? fmtNum(x, 0) + ' €' : fm === 'pct' ? pctS(x, 1) : nGTA(x));
  const t0 = performance.now(), dur = 1200;
  const paso = (t) => { const k = Math.min(1, (t - t0) / dur), e = 1 - Math.pow(1 - k, 3); el.textContent = k < 1 ? fmt(desde + (to - desde) * e) : fin; if (k < 1 && el.isConnected) requestAnimationFrame(paso); };
  requestAnimationFrame(paso);
}
/* lo que aparece al bajar: cada bloque entra cuando se ve */
function animarGTA(raiz) {
  const els = $$('.gta-rev', raiz);
  if ((window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches) || !('IntersectionObserver' in window)) { els.forEach((e) => e.classList.add('vis')); return null; }
  // la línea del camino se va rellenando según bajas
  const camino = $('.gta-camino', raiz);
  if (camino) {
    const prog = () => { const r = camino.getBoundingClientRect(), c = raiz.getBoundingClientRect(); const k = Math.max(0, Math.min(1, (c.top + c.height * 0.62 - r.top) / (r.height || 1))); camino.style.setProperty('--prog', k.toFixed(3)); };
    raiz.addEventListener('scroll', prog, { passive: true }); prog();
  }
  const io = new IntersectionObserver((ents) => {
    for (const en of ents) {
      if (!en.isIntersecting) continue;
      en.target.classList.add('vis'); io.unobserve(en.target);
      en.target.querySelectorAll('[data-to]').forEach(contarGTA);
    }
  }, { root: raiz, threshold: 0.15 });
  els.forEach((e) => io.observe(e));
  return io;
}

/* =====================================================================
   Radar de ideas (radar.json, rama datos): unas 400 empresas fijas más las que la Action encuentra cada
   día en toda la bolsa de EEUU y Europa con recomendación de compra. La Action renueva la ficha de cada
   una cada 3 horas y los precios cada 20 minutos; aquí, además, las que se ven en pantalla y las
   mejores ideas llegan en directo por el mismo canal que tu cartera.
   ===================================================================== */
async function cargarRadar() {
  const id = S.precios && S.precios.radar_id;
  if (!id) { if (S.precios && S.precios.radar && !S.radar) { S.radar = S.precios.radar; S.radarVer = (S.radarVer || 0) + 1; } return; }
  if (S.radar && S.radarId === id) return;
  let txt = null;
  try {
    if (CFG.dev) { const r = await fetch('dev/radar.json', { cache: 'no-store' }); if (r.ok) txt = await r.text(); }
    else {
      const r = await fetch(GH.raw('radar.json', 'datos') + '?v=' + encodeURIComponent(id), { cache: 'no-cache' }).catch(() => null);
      if (r && r.ok) txt = await r.text();
      else { const f = await GH.leer('radar.json', 'datos'); if (f) txt = f.texto; }
    }
  } catch (e) { console.warn(e); }
  if (txt) { try { localStorage.setItem('inv-cache-radar', txt); } catch (e) {} }
  else { try { txt = localStorage.getItem('inv-cache-radar'); } catch (e) {} }
  try { const j = txt ? JSON.parse(txt) : null; if (j) S.radar = j; } catch (e) {}
  S.radarId = id; S.radarVer = (S.radarVer || 0) + 1;
}

/* el radar con los precios en directo encima (y el potencial recalculado con ellos) */
function radarVals() {
  const r = S.radar && S.radar.valores;
  if (!r) return [];
  const c = S.radarCache;
  if (c && c.ver === S.radarVer && c.live === S.liveRVer) return c.v;
  const v = r.map((x) => {
    const l = S.liveR[x.s];
    if (!l || !(l.p > 0)) return x;
    const k = x.p ? l.p / x.p : 1;
    return { ...x, p: l.p, pe: x.pe != null ? x.pe * k : null, v: l.v != null ? l.v : x.v, pot: x.obj ? (x.obj / l.p - 1) * 100 : x.pot, vivo: true };
  });
  S.radarCache = { ver: S.radarVer, live: S.liveRVer, v };
  return v;
}
/* las que se siguen en directo: las de la tabla que estás viendo y las mejores para ti */
function simsRadarVivos() {
  const s = new Set(S.radarVisibles || []);
  for (const x of S.ideasTop || []) s.add(x);
  for (const i of (S.escaneo && S.escaneo.decision && S.escaneo.decision.ideas) || []) s.add(i.s);
  return [...s].slice(0, 90);
}

/* lo que ya tienes de cada empresa dentro de tus fondos (para no doblar la apuesta sin saberlo) */
const SOBRA_NOMBRE = new Set(['inc', 'corp', 'corporation', 'plc', 'sa', 'nv', 'ag', 'se', 'ltd', 'co', 'holding', 'holdings', 'group', 'class', 'a', 'b', 'c', 'the', 'company', 'ordinary', 'shares', 'new', 'registered', 'participating', 'preferred', 's', 'p', 'spa', 'asa', 'ab', 'oyj']);
const normEmpresa = (n) => normTxt(n).split(' ').filter((w) => w && !SOBRA_NOMBRE.has(w)).join(' ');
function dentroDeFondos(M) {
  if (S.dentroCache && S.dentroCache.M === M) return S.dentroCache.fn;
  const mapa = new Map(empresasPorDentro(M).filas.filter((e) => !e.directa).map((e) => [normEmpresa(e.n), e.v]));
  const fn = (n) => { const k = normEmpresa(n); let v = 0; for (const [kk, vv] of mapa) if (kk && k && (kk === k || kk.startsWith(k + ' ') || k.startsWith(kk + ' '))) v += vv; return v; };
  S.dentroCache = { M, fn };
  return fn;
}

/* ---------- contraste: siete comprobaciones independientes para cada empresa ----------
   Cada una mira una fuente distinta (analistas, sus revisiones, el rango de objetivos, las cuentas,
   la valoración frente a su sector, la tendencia del precio y la solidez del negocio). Una idea
   solo es buena si coinciden varias. 1 = a favor, -1 = en contra, 0 = neutral o sin datos. */
function perSectorMediano() {
  const c = S.perSectorCache;
  if (c && c.ver === S.radarVer) return c.m;
  const g = {};
  for (const x of (S.radar && S.radar.valores) || []) if (x.sector && x.perf > 0 && x.perf < 80) (g[x.sector] = g[x.sector] || []).push(x.perf);
  const m = {};
  for (const [k, a] of Object.entries(g)) { a.sort((p, q) => p - q); m[k] = a[Math.floor(a.length / 2)]; }
  S.perSectorCache = { ver: S.radarVer, m };
  return m;
}
function contraste(x) {
  const checks = [];
  const add = (k, ok, txt) => checks.push({ k, ok, txt });
  // 1. consenso de los analistas
  if (x.na && x.rm != null) add('Analistas', x.na >= 8 && x.rm <= 2.2 ? 1 : x.rm >= 2.8 || x.na < 4 ? -1 : 0, `${x.na} analistas, nota media ${fmtNum(x.rm, 1)} (1 es compra fuerte, 5 venta fuerte)`);
  else add('Analistas', 0, 'sin consenso de analistas');
  // 2. hacia dónde se mueven: votos de compra ahora frente a hace 3 meses
  if (x.v0 && x.v3 && sum(x.v0) && sum(x.v3)) {
    const a = (x.v0[0] + x.v0[1]) / sum(x.v0), b = (x.v3[0] + x.v3[1]) / sum(x.v3);
    add('Revisiones', a - b >= 0.03 ? 1 : a - b <= -0.03 ? -1 : 0, a - b >= 0.03 ? `más analistas a favor que hace 3 meses (${fmtNum(a * 100, 0)} % frente a ${fmtNum(b * 100, 0)} %)` : a - b <= -0.03 ? `menos analistas a favor que hace 3 meses (${fmtNum(a * 100, 0)} % frente a ${fmtNum(b * 100, 0)} %)` : 'los mismos analistas a favor que hace 3 meses');
  } else add('Revisiones', 0, 'sin histórico de recomendaciones');
  // 3. recorrido, y si hasta el analista más pesimista la ve cerca o por encima
  if (x.pot != null && x.p) {
    const bajo = x.tb ? (x.tb / x.p - 1) * 100 : null;
    add('Recorrido', x.pot >= 15 && (bajo == null || bajo >= -12) ? 1 : x.pot < 5 ? -1 : 0, `objetivo medio ${pctS(x.pot, 0)}${bajo != null ? `; el más pesimista, ${pctS(bajo, 0)}` : ''}`);
  } else add('Recorrido', 0, 'sin precio objetivo');
  // 4. beneficios: lo que esperan que gane el año que viene frente al último
  const crec = x.epsg != null ? x.epsg : x.eg;
  if (crec != null) add('Beneficios', crec >= 5 ? 1 : crec <= -5 ? -1 : 0, `beneficio por acción esperado ${pctS(crec, 0)}`);
  else add('Beneficios', 0, 'sin estimaciones de beneficio');
  // 5. valoración frente a su sector
  const med = x.sector && perSectorMediano()[x.sector];
  if (x.perf > 0 && med) add('Valoración', x.perf <= med * 0.9 ? 1 : x.perf >= med * 1.35 ? -1 : 0, `PER futuro de ${fmtNum(x.perf, 1)} frente a ${fmtNum(med, 1)} de su sector`);
  else if (x.perf != null && x.perf <= 0) add('Valoración', -1, 'se espera que pierda dinero');
  else add('Valoración', 0, 'sin PER futuro');
  // 6. tendencia del precio
  if (x.m200 && x.m50 && x.p) {
    const s200 = (x.p / x.m200 - 1) * 100;
    add('Tendencia', x.p > x.m200 && x.m50 > x.m200 ? 1 : x.p < x.m200 && x.m50 < x.m200 ? -1 : 0, `${pctS(s200, 0)} sobre su media de 200 sesiones${x.p < x.m50 ? ', por debajo de la de 50' : ''}`);
  } else add('Tendencia', 0, 'sin medias de precio');
  // 7. solidez del negocio: rentabilidad sobre el capital y deuda
  if (x.roe != null) {
    const banco = x.sector === 'Financiero';
    const ok = x.roe >= 12 && (banco || x.de == null || x.de < 150);
    const mal = x.roe < 4 || (!banco && x.de != null && x.de > 250);
    add('Solidez', ok ? 1 : mal ? -1 : 0, `ROE del ${fmtNum(x.roe, 0)} %${!banco && x.de != null ? `, deuda del ${fmtNum(x.de, 0)} % de su capital` : ''}`);
  } else add('Solidez', 0, 'sin datos de rentabilidad');
  const favor = checks.filter((c) => c.ok === 1).length, contra = checks.filter((c) => c.ok === -1).length;
  return { checks, favor, contra, total: checks.length };
}
function htmlContraste(ctr, conTexto) {
  const t = ctr.checks.map((c) => `${trad(c.k)}: ${trad(c.ok === 1 ? 'a favor' : c.ok === -1 ? 'en contra' : 'neutral')}, ${trad(c.txt)}`).join('. ');
  return `<span class="ctr" role="img" aria-label="${ctr.favor} de ${ctr.total} señales a favor y ${ctr.contra} en contra. ${esc(t)}" title="${esc(t)}">${ctr.checks.map((c) => `<i class="${c.ok === 1 ? 'si' : c.ok === -1 ? 'no' : ''}"></i>`).join('')}${conTexto ? `<b>${ctr.favor}/${ctr.total}</b>` : ''}</span>`;
}
function htmlContrasteLista(ctr) {
  return `<ul class="ctr-lista">${ctr.checks.map((c) => `<li class="${c.ok === 1 ? 'si' : c.ok === -1 ? 'no' : ''}"><b>${esc(c.k)}</b><span>${esc(c.txt)}</span></li>`).join('')}</ul>`;
}

const firmaSenales = (M) => [...new Set(M.filas.map((f) => `${f.inst.id}:${f.senal.nivel}`))].sort().join('|');

function pedidoAnalisis(ids, motivo, conWeb = true) {
  return `Haz la revisión de hoy de mi cartera (${motivo}). Antes de escribir:
0. Lee el informe de prensa de GrowFolio IA que viene en los datos (noticias de cada posición, del mercado y de las ideas, ya contrastadas) y úsalo como base.

function extraerJSON(texto) {
  const bloques = [...String(texto).matchAll(/```(?:json)?\s*([\s\S]*?)```/g)].map((m) => m[1]);
  const cands = bloques.length ? bloques.reverse() : [];
  const i = texto.indexOf('{'), j = texto.lastIndexOf('}');
  if (i >= 0 && j > i) cands.push(texto.slice(i, j + 1));
  for (const c of cands) { try { const o = JSON.parse(c); if (o && typeof o === 'object') return o; } catch (e) {} }
  return null;
}

  await cargarAsesor();

  if (edad > limite) generarAnalisisIA(p ? 'revisión diaria' : 'primera revisión');

async function cifrarLocal(obj) {
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const ct = new Uint8Array(await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, S.key, TE.encode(JSON.stringify(obj))));
  return { iv: b64.enc(iv), ct: b64.enc(ct) };
}
async function descifrarLocal(o) {
  const pt = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64.dec(o.iv) }, S.key, b64.dec(o.ct));
  return JSON.parse(TD.decode(pt));
}

    const enCartera = S.cartera && S.cartera.asesor && S.cartera.asesor[CAMPO_CLAVE[prov]];
    if (!AS.claves[prov] && enCartera) AS.claves[prov] = enCartera;

}

function instruccionesAsesor() {
  const anio = new Date().getFullYear();
  return `Eres el asesor de inversiones personal del dueño de esta cartera y estás dentro de su web privada de inversiones. Tienes delante su cartera real con cifras al céntimo y herramientas que calculan con el mismo motor que GrowFolio.

Cómo respondes:
- En español de España, tuteando, con tono cercano y directo: como un amigo que sabe mucho de inversión y de impuestos.
- Primero la respuesta o la recomendación concreta (qué hacer, cuánto, cuándo y dónde). Después el porqué, con números de su cartera.
- Nada de avisos de que no eres asesor financiero ni de "consulta a un profesional": no los quiere. Los riesgos concretos sí, cuando importen.
- Antes de recomendar vender, usa simular_venta para dar la ganancia que se declara y el impuesto (FIFO y escala del ahorro con lo que ya lleva en el año). Antes de recomendar comprar una acción, usa simular_compra para la tasa del país, la comisión y cómo queda su límite de acciones sueltas.
- Contrasta: no recomiendes nada apoyándote en una sola fuente. Cruza el consenso y el rango de objetivos de los analistas, las cuentas (valoración, crecimiento, deuda), la tendencia del precio y las noticias. Si buscas en internet, busca al menos dos fuentes distintas y di si coinciden o no. Si las fuentes chocan, dilo. Si no puedes buscar, contrasta con los titulares que tienes en los datos y dilo.
- Usa solo datos que tengas: los de abajo, los de las herramientas o los de internet. Si te falta algo de hoy, búscalo y di de dónde sale. Si algo no se puede saber, dilo.
- Respeta sus reglas: el límite de acciones sueltas, el fondo de renta fija como colchón, sus aportaciones automáticas y sus reglas para apuestas.
- Antes de recomendar una acción, mira si ya tiene otra suelta del mismo negocio (dos aerolíneas, dos petroleras…): sería repetir la misma apuesta. Dilo claro y, si aun así compensa, explica qué añade que no tenga ya.
- Formato: frases cortas, números en formato español (1.234,56 €), negrita solo para la cifra o la acción clave, listas cuando ayuden a seguir pasos y tablas solo para comparar opciones. Breve salvo que pida detalle.
- Si la pregunta es ambigua, contesta la interpretación más útil y di cuál has tomado.
- Lenguaje llano: no es experto. Nada de jerga sin explicar (catalizador, capex, amplitud de mercado, soportes, recorrido, múltiplos, TER, beta…): dilo con palabras normales o explícalo en la misma frase. En los textos cortos que salen en tarjetas (motivos, vigilar, titulares, qué supone), una o dos frases y empieza por lo que significa para él.

/* ---------- markdown mínimo y seguro para las respuestas ---------- */
function md(src) {
  const inline = (s) => s
    .replace(/`([^`]+)`/g, '<code>$1</code>')
    .replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>')
    .replace(/(^|[^*\w])\*([^*\n]+)\*(?!\w)/g, '$1<i>$2</i>')
    .replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g, '<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>');
  const lineas = esc(src).split('\n');
  let html = '', lista = null, tabla = null, par = [];
  const cerrarPar = () => { if (par.length) { html += `<p>${inline(par.join('<br>'))}</p>`; par = []; } };
  const cerrarLista = () => { if (lista) { html += `<${lista.t}>${lista.items.map((x) => `<li>${inline(x)}</li>`).join('')}</${lista.t}>`; lista = null; } };
  const cerrarTabla = () => {
    if (!tabla) return;
    const celdas = (l) => l.replace(/^\s*\|/, '').replace(/\|\s*$/, '').split('|').map((c) => c.trim());
    const filas = tabla.filter((l) => !/^\s*\|?\s*:?-{2,}/.test(l)).map(celdas);
    const [cab, ...resto] = filas;
    html += `<div class="as-tabla"><table><thead><tr>${cab.map((c) => `<th>${inline(c)}</th>`).join('')}</tr></thead><tbody>${resto.map((f) => `<tr>${f.map((c) => `<td>${inline(c)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
    tabla = null;
  };
  const cerrar = () => { cerrarPar(); cerrarLista(); cerrarTabla(); };
  for (const l of lineas) {
    let m;
    if (/^\s*\|.*\|\s*$/.test(l)) { cerrarPar(); cerrarLista(); (tabla = tabla || []).push(l); continue; }
    if (tabla) cerrarTabla();
    if (!l.trim()) { cerrar(); continue; }
    if ((m = /^\s*#{1,6}\s+(.*)$/.exec(l))) { cerrar(); html += `<h4>${inline(m[1])}</h4>`; continue; }
    if (/^\s*(-{3,}|\*{3,})\s*$/.test(l)) { cerrar(); html += '<hr>'; continue; }
    if ((m = /^\s*[-*•]\s+(.*)$/.exec(l))) { cerrarPar(); if (!lista || lista.t !== 'ul') { cerrarLista(); lista = { t: 'ul', items: [] }; } lista.items.push(m[1]); continue; }
    if ((m = /^\s*\d+[.)]\s+(.*)$/.exec(l))) { cerrarPar(); if (!lista || lista.t !== 'ol') { cerrarLista(); lista = { t: 'ol', items: [] }; } lista.items.push(m[1]); continue; }
    if (lista && /^\s{2,}\S/.test(l)) { lista.items[lista.items.length - 1] += ' ' + l.trim(); continue; }
    cerrarLista(); par.push(l);
  }
  cerrar();
  return html;
}

/* =====================================================================
   Bloqueo con PIN o huella. Encima de "Recordar en este dispositivo" (y, cuando lleguen las cuentas,
   encima de la sesión de Google): la app se abre sola, pero una vez cada 72 horas pide el PIN de 4
   cifras o la huella. Cinco PIN mal seguidos olvidan la clave del dispositivo y piden la contraseña.
   Huella: en la app de Android, la del sistema (BiometricPrompt, por el puente); en el navegador,
   WebAuthn con el lector del dispositivo (huella, cara o Windows Hello).
   Es un candado de uso diario frente a quien coja el móvil, no sustituye al cifrado con la contraseña.
   ===================================================================== */
const BLOQUEO_H = 72, BLOQUEO_FALLOS = 5;
const cfgBloqueo = () => LS.get('inv-bloqueo', null);
const guardarBloqueo = (c) => (c ? LS.set('inv-bloqueo', c) : LS.del('inv-bloqueo'));
const marcarDesbloqueo = () => LS.set('inv-bloqueo-t', Date.now());
function necesitaBloqueo() {
  const c = cfgBloqueo();
  return !!(c && c.pin) && Date.now() - (+LS.get('inv-bloqueo-t', 0) || 0) > BLOQUEO_H * 3600000;
}
async function hashPin(pin, salt) {
  const base = await crypto.subtle.importKey('raw', TE.encode(pin), 'PBKDF2', false, ['deriveBits']);
  return b64.enc(new Uint8Array(await crypto.subtle.deriveBits({ name: 'PBKDF2', salt, iterations: 200000, hash: 'SHA-256' }, base, 256)));
}
// ¿qué huella hay en este dispositivo? 'app' (Android), 'web' (WebAuthn) o null
async function huellaPosible() {
  const a = window.InversionesApp;
  if (a && typeof a.huellaDisponible === 'function') { try { return a.huellaDisponible() ? 'app' : null; } catch (e) { return null; } }
  if (a) return null;  // app antigua: el WebView no tiene WebAuthn
  try { return window.PublicKeyCredential && (await PublicKeyCredential.isUserVerifyingPlatformAuthenticatorAvailable()) ? 'web' : null; } catch (e) { return null; }
}
let huellaEspera = null;
window.resultadoHuella = (ok, motivo) => { const r = huellaEspera; huellaEspera = null; if (r) r({ ok: !!ok, motivo: motivo || '' }); };
function huellaApp() {
  return new Promise((res) => {
    huellaEspera = res;
    try { window.InversionesApp.pedirHuella(IDIOMA === 'en' ? 'Unlock GrowFolio' : 'Desbloquea GrowFolio', IDIOMA === 'en' ? 'Use PIN' : 'Usar el PIN'); } catch (e) { huellaEspera = null; res({ ok: false, motivo: 'sin puente' }); }
  });
}
async function registrarHuellaWeb() {
  const cred = await navigator.credentials.create({ publicKey: {
    challenge: crypto.getRandomValues(new Uint8Array(32)), rp: { name: 'GrowFolio' },
    user: { id: crypto.getRandomValues(new Uint8Array(16)), name: 'GrowFolio', displayName: 'GrowFolio' },
    pubKeyCredParams: [{ type: 'public-key', alg: -7 }, { type: 'public-key', alg: -257 }],
    authenticatorSelection: { authenticatorAttachment: 'platform', userVerification: 'required', residentKey: 'discouraged' }, timeout: 60000,
  } });
  return b64.enc(new Uint8Array(cred.rawId));
}
async function huellaWeb(id) {
  try {
    const r = await navigator.credentials.get({ publicKey: { challenge: crypto.getRandomValues(new Uint8Array(32)), allowCredentials: [{ type: 'public-key', id: b64.dec(id) }], userVerification: 'required', timeout: 60000 } });
    const flags = new Uint8Array(r.response.authenticatorData)[32];
    return { ok: !!(flags & 0x04) };  // el lector comprobó que eres tú (huella, cara o PIN del sistema)
  } catch (e) { return { ok: false, motivo: e.name }; }
}
const pedirHuella = (c) => (c.huella && c.huella.tipo === 'app' ? huellaApp() : c.huella && c.huella.tipo === 'web' ? huellaWeb(c.huella.id) : Promise.resolve({ ok: false }));

/* la pantalla: cuatro puntos, teclado numérico grande y, si la hay, la huella */
function pantallaBloqueo(alAbrir, conContrasena) {
  const c = cfgBloqueo(); if (!c) return alAbrir();
  $$('.bloqueo').forEach((x) => x.remove());
  const el = document.createElement('div');
  el.className = 'bloqueo'; el.setAttribute('role', 'dialog'); el.setAttribute('aria-modal', 'true'); el.setAttribute('aria-label', 'GrowFolio bloqueado');
  const teclas = ['1', '2', '3', '4', '5', '6', '7', '8', '9', c.huella ? 'huella' : '', '0', 'borrar'];
  el.innerHTML = `<div class="bq-caja">
    <img class="logo" src="favicon.svg" alt="">
    <h1>Hola de nuevo</h1>
    <p class="bq-txt">${c.huella ? 'Pon tu huella o tu PIN para ver tu cartera.' : 'Pon tu PIN para ver tu cartera.'}</p>
    <div class="bq-puntos" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
    <p class="bq-error" role="alert"></p>
    <div class="bq-teclado">${teclas.map((t) => (!t ? '<span></span>' : t === 'huella' ? `<button type="button" data-t="huella" aria-label="Usar la huella">${ICONOS.huella}</button>` : t === 'borrar' ? `<button type="button" data-t="borrar" aria-label="Borrar">${ICONOS.borrarTecla}</button>` : `<button type="button" data-t="${t}">${t}</button>`)).join('')}</div>
    <button type="button" class="enlace bq-pass">Usar la contraseña</button>
  </div>`;
  document.body.appendChild(el);
  let pin = '', ocupado = false;
  const puntos = $$('.bq-puntos i', el), err = $('.bq-error', el);
  const pintarPuntos = () => puntos.forEach((p, i) => p.classList.toggle('on', i < pin.length));
  const abrir = () => { marcarDesbloqueo(); const cc = cfgBloqueo(); if (cc && cc.fallos) { cc.fallos = 0; guardarBloqueo(cc); } document.removeEventListener('keydown', tecla, true); el.classList.add('sale'); setTimeout(() => el.remove(), 220); alAbrir(); };
  const aContrasena = () => { document.removeEventListener('keydown', tecla, true); el.remove(); conContrasena(); };
  const comprobar = async () => {
    ocupado = true;
    const cc = cfgBloqueo();
    const ok = (await hashPin(pin, b64.dec(cc.salt))) === cc.pin;
    if (ok) return abrir();
    cc.fallos = (cc.fallos || 0) + 1; guardarBloqueo(cc);
    pin = ''; pintarPuntos(); ocupado = false;
    el.querySelector('.bq-puntos').classList.remove('mal'); void el.offsetWidth; el.querySelector('.bq-puntos').classList.add('mal');
    const quedan = BLOQUEO_FALLOS - cc.fallos;
    if (quedan <= 0) {
      cc.fallos = 0; guardarBloqueo(cc);
      await IDB.del(IDB_CLAVE);
      toast('Demasiados intentos: entra con tu contraseña.');
      return aContrasena();
    }
    err.textContent = `PIN incorrecto. ${quedan === 1 ? 'Te queda 1 intento' : `Te quedan ${quedan} intentos`} antes de pedirte la contraseña.`;
  };
  const pulsar = (t) => {
    if (ocupado) return;
    if (t === 'huella') return probarHuella();
    if (t === 'borrar') { pin = pin.slice(0, -1); return pintarPuntos(); }
    if (pin.length >= 4) return;
    pin += t; err.textContent = ''; pintarPuntos();
    if (pin.length === 4) setTimeout(comprobar, 120);
  };
  const probarHuella = async () => {
    if (ocupado) return;
    ocupado = true;
    const r = await pedirHuella(cfgBloqueo());
    ocupado = false;
    if (r.ok) return abrir();
    if (r.motivo && !/cancel|pin|NotAllowed|AbortError/i.test(r.motivo)) err.textContent = 'No se pudo leer la huella. Prueba otra vez o usa el PIN.';
  };
  const tecla = (e) => {
    if (/^\d$/.test(e.key)) { e.preventDefault(); pulsar(e.key); } else if (e.key === 'Backspace') { e.preventDefault(); pulsar('borrar'); }
  };
  document.addEventListener('keydown', tecla, true);
  el.addEventListener('click', (e) => { const b = e.target.closest('[data-t]'); if (b) pulsar(b.dataset.t); });
  $('.bq-pass', el).onclick = aContrasena;
  if (c.huella) setTimeout(probarHuella, 350);
}

    else huella = { tipo: 'web', id: await registrarHuellaWeb() };
    const cc = cfgBloqueo(); cc.huella = huella; guardarBloqueo(cc);
    toast('Huella activada.'); recargar();
  } catch (e) { console.warn(e); toast('No se activó la huella.'); }
}
function ponerPin(recargar) {
  const h = hoja('Tu PIN', `<form id="fPin">
    <p class="nota" style="margin:0">Cuatro cifras que recuerdes y que no sean obvias (nada de 1234 o tu año de nacimiento). Con él abres GrowFolio en este dispositivo; tu contraseña sigue siendo la llave de verdad.</p>
    <label class="campo">PIN nuevo<input type="password" id="pin1" inputmode="numeric" pattern="[0-9]{4}" maxlength="4" autocomplete="new-password" required></label>
    <label class="campo">Repítelo<input type="password" id="pin2" inputmode="numeric" pattern="[0-9]{4}" maxlength="4" autocomplete="new-password" required></label>
    <div class="error" id="pinErr"></div>
    <div class="fila-btns"><button type="button" class="btn" data-cerrar>Cancelar</button><button type="submit" class="btn pri">Guardar el PIN</button></div>
  </form>`);
  $('#fPin', h.el).onsubmit = async (ev) => {
    ev.preventDefault();
    const a = $('#pin1', h.el).value.trim(), b = $('#pin2', h.el).value.trim();
    if (!/^\d{4}$/.test(a)) return ($('#pinErr', h.el).textContent = 'Tienen que ser 4 cifras.');
    if (a !== b) return ($('#pinErr', h.el).textContent = 'No coinciden. Escríbelo igual las dos veces.');
    if (/^(\d)\1{3}$/.test(a) || '0123456789'.includes(a) || '9876543210'.includes(a)) return ($('#pinErr', h.el).textContent = 'Es demasiado fácil de adivinar. Prueba con otro.');
    const salt = crypto.getRandomValues(new Uint8Array(16));
    const antes = cfgBloqueo();
    guardarBloqueo({ pin: await hashPin(a, salt), salt: b64.enc(salt), fallos: 0, ...(antes && antes.huella ? { huella: antes.huella } : {}) });
    marcarDesbloqueo();
    // el PIN solo tiene sentido si la clave se recuerda en el dispositivo
    if (S.key && S.salt) await IDB.set(IDB_CLAVE, { salt: b64.enc(S.salt), key: S.key });
    h.cerrar();
    const tipo = !antes && (await huellaPosible());
    toast(antes ? 'PIN cambiado.' : 'PIN puesto.');
    if (tipo) return ofrecerHuella(tipo, recargar);
    recargar();
  };
}
function ofrecerHuella(tipo, recargar) {
  const h = hoja('¿También con la huella?', `<p class="nota" style="margin:0">${tipo === 'app' ? 'Tu móvil tiene lector de huella o de cara.' : 'Este dispositivo tiene lector (huella, cara o Windows Hello).'} Con él desbloqueas sin escribir el PIN; el PIN sigue valiendo por si acaso.</p>
    <div class="fila-btns"><button type="button" class="btn" data-cerrar>Solo PIN</button><button type="button" class="btn pri" id="bSiHuella">Usar la huella</button></div>`, recargar);
  $('#bSiHuella', h.el).onclick = () => { h.el.remove(); activarHuella(tipo, recargar); };
}

/* =====================================================================
   Idiomas. GrowFolio está escrita en español; en inglés, un diccionario (en.json) cambia los textos
   según van apareciendo en pantalla. Primera fase: pestañas, botones, formularios, la presentación, el
   tutorial y los avisos. Noticias, informes de la IA y parte de los textos siguen en español.
   Los números se buscan como "#": "Tienes 3 posiciones" usa la plantilla "Tienes # posiciones".
   Cambiar de idioma recarga la página.
   ===================================================================== */
const IDIOMAS = [['es', 'Español'], ['en', 'English']];
const IDIOMA = LS.get('inv-idioma', 'es') === 'en' ? 'en' : 'es';
// "Repsol, BAT y IAG" / "Repsol, BAT and IAG": las listas se juntan ya en el idioma de la app
// trozos que se montan en el código (títulos, aria-label, listas) y se traducen antes de pintarse
const trad = (s) => (IDIOMA === 'en' && I18N.dic ? traducirTexto(s) ?? s : s);
const yLista = (a) => (a.length > 1 ? `${a.slice(0, -1).join(', ')}${IDIOMA === 'en' ? ' and ' : ' y '}${a[a.length - 1]}` : a.join(''));
const I18N = { dic: null };
const NUM_I18N = /[-+−]?\d[\d.,]*/g;
const ATR_I18N = ['placeholder', 'title', 'aria-label', 'alt'];
let banderaN = 0;
function banderaIdioma(c) {
  if (c === 'es') return '<svg class="bandera" viewBox="0 0 30 20" aria-hidden="true"><rect width="30" height="20" fill="#AA151B"/><rect y="5" width="30" height="10" fill="#F1BF00"/></svg>';
  const id = 'bd' + (++banderaN);
  return `<svg class="bandera" viewBox="0 0 60 30" preserveAspectRatio="xMidYMid slice" aria-hidden="true"><clipPath id="${id}a"><path d="M0 0v30h60V0z"/></clipPath><clipPath id="${id}b"><path d="M30 15h30v15zv15H0zH0V0zV0h30z"/></clipPath><g clip-path="url(#${id}a)"><path d="M0 0v30h60V0z" fill="#012169"/><path d="M0 0l60 30m0-30L0 30" stroke="#fff" stroke-width="6"/><path d="M0 0l60 30m0-30L0 30" clip-path="url(#${id}b)" stroke="#C8102E" stroke-width="4"/><path d="M30 0v30M0 15h60" stroke="#fff" stroke-width="10"/><path d="M30 0v30M0 15h60" stroke="#C8102E" stroke-width="6"/></g></svg>`;
}
function selectorIdioma(clase = '') {
  return `<div class="idiomas ${clase}" role="group" aria-label="Idioma / Language" data-no-trad>${IDIOMAS.map(([c, n]) => `<button type="button" data-idioma="${c}" aria-pressed="${c === IDIOMA}" lang="${c}">${banderaIdioma(c)}<span>${n}</span></button>`).join('')}</div>`;
}
document.addEventListener('click', (e) => {
  const b = e.target.closest('[data-idioma]'); if (!b) return;
  e.preventDefault();
  if (b.dataset.idioma === IDIOMA) return;
  LS.set('inv-idioma', b.dataset.idioma);
  location.reload();
});
// los importes llevan un espacio duro antes del € (así no se parten): para buscar se usa uno normal y
// en la traducción se vuelve a pegar el número a su € o %
function traducirTexto(s) {
  if (!s || !I18N.dic) return null;
  if (!/[  ]/.test(s)) return traducirTextoN(s);
  const t = traducirTextoN(s.replace(/[  ]/g, ' '));
  return t == null ? null : t.replace(/(\d) (€|%)/g, '$1 $2');
}
function traducirTextoN(s) {
  const d = I18N.dic;
  let t = d[s]; if (t != null) return t;
  const nums = [];
  const k = s.replace(NUM_I18N, (m) => { nums.push(m); return '#'; });
  if (nums.length && (t = d[k]) != null) {
    let i = 0;
    return t.replace(/\{(\d)\}|#/g, (m, n) => (n ? nums[+n - 1] : nums[i++]) ?? m);
  }
  // plantillas con nombres dentro: "Abrir la ficha de Repsol" → "Open Repsol details". Cada trozo
  // variable se traduce a su vez (países, sectores…) y si no está, se deja tal cual.
  for (const [re, en, clave] of I18N.re || []) {
    if (!s.includes(clave)) continue;
    const m = re.exec(s);
    if (m) return en.replace(/\$(\d)/g, (_, n) => { const g = m[+n] || ''; return traducirTexto(g.trim()) ?? g; });
  }
  // frases que empiezan igual y siguen con datos: "Lo que más mueve hoy: Repsol +2 %…"
  for (const [es, en] of I18N.pre || []) if (s.startsWith(es)) return en + s.slice(es.length);
  return null;
}
function traducirTN(n) {
  const v = n.nodeValue;
  if (!v || !/[A-Za-zÁÉÍÓÚáéíóúÑñ¿¡]/.test(v)) return;
  const s = v.trim(), t = traducirTexto(s);
  if (t == null || t === s) return;
  const i = v.indexOf(s);
  n.nodeValue = v.slice(0, i) + t + v.slice(i + s.length);
}
function traducirAtr(el) {
  for (const a of ATR_I18N) {
    const v = el.getAttribute(a); if (!v) continue;
    const t = traducirTexto(v.trim());
    if (t != null && t !== v) el.setAttribute(a, t);
  }
}
const SALTA_I18N = (el) => /^(SCRIPT|STYLE|TEXTAREA|CODE|PRE)$/.test(el.nodeName) || el.hasAttribute('data-no-trad');
function traducirNodo(raiz) {
  if (!I18N.dic || !raiz) return;
  if (raiz.nodeType === 3) { const p = raiz.parentElement; if (p && !p.closest('[data-no-trad], script, style, textarea')) traducirTN(raiz); return; }
  if (raiz.nodeType !== 1 || SALTA_I18N(raiz) || (raiz.parentElement && raiz.parentElement.closest('[data-no-trad], textarea'))) return;
  traducirAtr(raiz);
  const w = document.createTreeWalker(raiz, NodeFilter.SHOW_TEXT | NodeFilter.SHOW_ELEMENT, { acceptNode: (n) => (n.nodeType === 1 && SALTA_I18N(n) ? NodeFilter.FILTER_REJECT : NodeFilter.FILTER_ACCEPT) });
  for (let n = w.nextNode(); n; n = w.nextNode()) { if (n.nodeType === 3) traducirTN(n); else traducirAtr(n); }
}
const obsI18N = new MutationObserver((ms) => {
  for (const m of ms) {
    if (m.type === 'childList') m.addedNodes.forEach(traducirNodo);
    else if (m.type === 'characterData') traducirNodo(m.target);
    else if (m.type === 'attributes' && m.target.nodeType === 1 && !m.target.closest('[data-no-trad]')) traducirAtr(m.target);
  }
});
// en inglés: se espera al diccionario (como mucho 2,5 s) antes de enseñar nada, para no ver el cambio
async function cargarIdioma() {
  if (IDIOMA !== 'en') return;
  const raiz = document.documentElement;
  raiz.lang = 'en'; raiz.classList.add('i18n-carga');
  const ver = setTimeout(() => raiz.classList.remove('i18n-carga'), 2500);
  try {
    const r = await fetch('en.json?v=' + VERSION);
    if (r.ok) { const j = await r.json(); I18N.dic = j.t || null; I18N.pre = Object.entries(j.p || {}).sort((x, y) => y[0].length - x[0].length); I18N.re = (j.r || []).map(([p, en, c]) => [new RegExp(p), en, c]); }
  } catch (e) { console.warn('Sin diccionario de inglés', e); }
  clearTimeout(ver);
  if (I18N.dic) {
    traducirNodo(document.body);
    document.title = traducirTexto(document.title) || document.title;
    obsI18N.observe(document.body, { childList: true, subtree: true, characterData: true, attributes: true, attributeFilter: ATR_I18N });
    avisoIngles();
  }
  raiz.classList.remove('i18n-carga');
}
// la franja de arriba: el inglés está a medias
function avisoIngles() {
  try { if (sessionStorage.getItem('inv-aviso-en')) return; } catch (e) {}
  const d = document.createElement('div');
  d.className = 'aviso-idioma'; d.setAttribute('data-no-trad', ''); d.setAttribute('role', 'note');
  d.innerHTML = `${banderaIdioma('en')}<p><b>English version in progress.</b> News, AI reports and some texts are still in Spanish.</p><button type="button" class="ai-es" data-idioma="es">${banderaIdioma('es')}Español</button><button type="button" class="ai-x" aria-label="Close">${ICONOS.cerrar}</button>`;
  d.querySelector('.ai-x').onclick = () => { d.remove(); try { sessionStorage.setItem('inv-aviso-en', '1'); } catch (e) {} };
  document.body.prepend(d);
}
// lo que se le pide a GrowFolio IA, en el idioma de la app
const notaIdiomaIA = () => (IDIOMA === 'en' ? '\n\nIDIOMA: el usuario usa GrowFolio en inglés. Escribe en inglés todos los textos que vea él (respuestas, resúmenes, motivos, pasos), aunque estas instrucciones y los datos estén en español. Las claves del JSON no se traducen.' : '');

async function iniciar() {
  cargarIdioma();
  // en la app de Android, lo primero de todo: ¿hay versión nueva de la app?
  if (window.InversionesApp) setTimeout(() => revisarApp(), 900);
  $('#app').innerHTML = '';
  const t0 = mostrarEntrada();
  try {
    const [, , enc, iaRem] = await Promise.all([cargarInstrumentos(), cargarPrecios().then(() => Promise.all([cargarHistorico(), cargarIntradia(), cargarRadar(), cargarInforme(), cargarEscaneo(), cargarCatalogo()])), cargarCifrada(), leerAnalisisRemoto()]);
    S.enc = enc; S.iaRemoto = iaRem;
  } catch (e) {
    console.error(e);
    quitarEntrada();
    $('#app').innerHTML = `<div class="pantalla"><div class="caja"><h1>No se pudo cargar</h1><p>${esc(e.message)}</p><button class="btn pri" onclick="location.reload()">Reintentar</button></div></div>`;
    return;
  }
  await esperarEntrada(t0);
  await entrar();
  quitarEntrada();
}
/* ---------- la entrada: el logo se monta (carpeta, línea que sube, hoja) y te saluda según la hora ----------
   Sale mientras carga todo; dura al menos lo que tarda la animación y se funde con lo que venga después. */
const saludoHora = () => { const h = new Date().getHours(); return h >= 6 && h < 14 ? 'Buenos días' : h >= 14 && h < 21 ? 'Buenas tardes' : 'Buenas noches'; };
function mostrarEntrada() {
  const quieto = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
  const n = nombreUsuario();
  const d = document.createElement('div');
  d.className = 'entrada' + (quieto ? ' quieta' : ''); d.id = 'entrada'; d.setAttribute('role', 'status');
  d.innerHTML = `<div class="en-c"><svg class="en-svg" viewBox="0 0 48 48" aria-hidden="true"><path class="en-atras" d="M8 15.5C8 14.1 9.1 13 10.5 13H18.2C19 13 19.7 13.4 20.2 14L22.3 16.5H37.5C38.9 16.5 40 17.6 40 19V35.5C40 36.9 38.9 38 37.5 38H10.5C9.1 38 8 36.9 8 35.5Z" fill="#A97C33"/><path class="en-linea" pathLength="1" d="M13.5 25.5L19.5 19L24 22L31.5 11.5" fill="none" stroke="#4FC995" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/><path class="en-hoja" d="M31.2 11.8C30.6 7 33.8 4.4 39 4.8C39.2 9.8 35.8 12.6 31.2 11.8Z" fill="#4FC995"/><path class="en-delante" d="M8 25C8 23.9 8.9 23 10 23H38C39.1 23 40 23.9 40 25V35.5C40 36.9 38.9 38 37.5 38H10.5C9.1 38 8 36.9 8 35.5Z" fill="#E2B45F"/><path class="en-delante" d="M14 30.5H34" stroke="#1F1D19" stroke-opacity="0.18" stroke-width="2" stroke-linecap="round"/></svg><p class="en-saludo">${esc(saludoHora())}${n ? `, <b>${esc(n)}</b>` : ''}</p><p class="en-marca">GrowFolio</p><div class="en-barra" aria-hidden="true"><i></i></div></div>`;
  document.body.appendChild(d);
  return { t: performance.now(), min: quieto ? 0 : 1700 };
}
const esperarEntrada = (t0) => new Promise((r) => setTimeout(r, Math.max(0, t0.min - (performance.now() - t0.t))));
function quitarEntrada() {
  const d = $('#entrada'); if (!d || d.classList.contains('fuera')) return;
  d.classList.add('fuera'); setTimeout(() => d.remove(), 650);
}
/* después de cargar: la cuenta (si toca), crear la cartera o abrirla con la clave guardada */
async function entrar() {
  if (PERFIL_CUENTA && !FB.user && !S.cuentaSinRed) return pantallaCuenta();
  // la primera vez en este dispositivo, antes de crear la cartera o entrar, la presentación
  const intro = !LS.get('inv-intro', false);
  if (!S.enc && PERFIL_CUENTA) return intro ? pantallaIntro(bienvenidaCuenta) : bienvenidaCuenta();
  if (!S.enc) return intro ? pantallaIntro(pantallaCrear) : pantallaCrear();
  try {
    const f = JSON.parse(S.enc.texto);
    const guardada = await IDB.get(IDB_CLAVE);
    if (guardada && guardada.key && guardada.salt === f.salt) {
      S.cartera = await descifrar(S.enc.texto, guardada.key);
      S.key = guardada.key; S.salt = b64.dec(f.salt); S.iter = f.iter || 600000;
      // con PIN o huella puestos, una vez cada 72 h los pide antes de enseñar nada
      const seguir = () => (necesitaBloqueo() ? pantallaBloqueo(arrancar, () => { S.cartera = null; S.key = null; pantallaDesbloqueo(); }) : arrancar());
      // también a quien ya entra solo: la presentación, una vez en cada dispositivo
      return intro ? pantallaIntro(seguir) : seguir();
    }
  } catch (e) { console.warn('La clave guardada no sirve', e); }
  if (intro) pantallaIntro(() => pantallaDesbloqueo()); else pantallaDesbloqueo();
}

if ('serviceWorker' in navigator && location.protocol === 'https:') {
  navigator.serviceWorker.register('sw.js').catch(() => {});
  navigator.serviceWorker.addEventListener('message', (e) => { if (e.data && e.data.type === 'inv-actualizada') avisoWebNueva(); });
}
iniciar();
