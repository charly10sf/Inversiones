plugins {
    id 'com.android.application'
}

// La firma: la clave vive en android/firma.p12, cifrada con el secreto ANDROID_CLAVE de GitHub.
// Sin ese secreto, la Action firma con una clave de prueba solo para comprobar que compila.
def rutaFirma = System.getenv('FIRMA_RUTA')
def claveFirma = System.getenv('FIRMA_CLAVE')

android {
    namespace 'es.inversiones.app'
    compileSdk 36

    defaultConfig {
        applicationId 'es.inversiones.app'
        minSdk 26
        targetSdk 34
        versionCode((System.getenv('VERSION_CODE') ?: '1') as int)
        // el mismo número que la web (0.x mientras esté en alfa); la Action lo saca de index.html
        versionName System.getenv('VERSION_NAME') ?: "0.0.${System.getenv('VERSION_CODE') ?: '0'}"
    }

    // 0.8.3 · Dos versiones de la misma app. «directa»: la APK de GitHub de siempre (es.inversiones.app, se actualiza
    // sola, targetSdk 34). «play»: la de Google Play, que Play actualiza; Play pide targetSdk 36 a las apps nuevas desde
    // el 31 ago 2026. Su número de versión va con un millón delante: así nunca es menor que el de app.json y la web no le
    // ofrece la APK. El paquete de Play no se puede cambiar una vez publicado: es.toison.app (POR CONFIRMAR con Carlos
    // antes de la primera subida).
    flavorDimensions 'canal'
    productFlavors {
        directa {
            dimension 'canal'
            buildConfigField 'boolean', 'ACTUALIZA_SOLA', 'true'
        }
        play {
            dimension 'canal'
            applicationId 'es.toison.app'
            targetSdk 36
            versionCode(1000000 + ((System.getenv('VERSION_CODE') ?: '1') as int))
            buildConfigField 'boolean', 'ACTUALIZA_SOLA', 'false'
        }
    }

    signingConfigs {
        release {
            if (rutaFirma && claveFirma) {
                storeFile file(rutaFirma)
                storePassword claveFirma
                keyAlias 'inversiones'
                keyPassword claveFirma
                storeType 'pkcs12'
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (rutaFirma && claveFirma) signingConfig signingConfigs.release
        }
    }

    buildFeatures { buildConfig true }

    // que los avisos de lint no paren la compilación (la de Play se revisa con el informe previo de Play Console)
    lint {
        checkReleaseBuilds false
        abortOnError false
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

// Entrar con Google dentro de la app (Credential Manager): Google no deja hacerlo desde la web metida en la app
dependencies {
    implementation 'androidx.credentials:credentials:1.3.0'
    implementation 'androidx.credentials:credentials-play-services-auth:1.3.0'
    implementation 'com.google.android.libraries.identity.googleid:googleid:1.1.1'
    implementation 'com.google.android.gms:play-services-auth:21.2.0'
    implementation 'androidx.work:work-runtime:2.9.1'
}
