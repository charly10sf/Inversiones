<!doctype html><html><head><meta charset="utf-8"><style>
<!-- Fuente de las imágenes de los correos (worker/correo/img). Se abre con Playwright a 2x, con ibarra.woff2 (fonts/) copiada al lado, y se recorta: la cabecera (#h, ?l=es|en) en hero-es/en.jpg y los iconos (#i-…) en i-*.png. Luego: node worker/correo/empaquetar.mjs -->
@font-face{font-family:Ib;src:url(ibarra.woff2)}
body{margin:0;background:transparent;padding:20px;display:flex;flex-wrap:wrap;gap:20px}
.ic{width:44px;height:44px;border-radius:11px;background:#0b0b0b;display:flex;align-items:center;justify-content:center;box-shadow:inset 0 0 0 1px #2a2a2a}
.ic svg{width:24px;height:24px;fill:none;stroke:url(#g);stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
#hero{width:496px;height:200px;border-radius:14px;overflow:hidden;position:relative;background:radial-gradient(120% 140% at 20% 0%,#1d1d1d 0%,#070707 55%,#000 100%)}
</style></head><body>
<svg width="0" height="0" style="position:absolute"><defs><linearGradient id="g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f7dfa8"/><stop offset=".55" stop-color="#e3b45f"/><stop offset="1" stop-color="#b5863a"/></linearGradient></defs></svg>
<div class="ic" id="i-cartera"><svg viewBox="0 0 24 24"><path d="M12 3a9 9 0 1 0 9 9h-9z"/><path d="M15 3.5A9 9 0 0 1 20.5 9H15z"/></svg></div>
<div class="ic" id="i-paso"><svg viewBox="0 0 24 24"><rect x="4" y="3.5" width="16" height="17" rx="2.5"/><path d="M8 9l1.6 1.6L12.5 7.7M8 15l1.6 1.6 2.9-2.9M14.5 9.5H17M14.5 15.5H17"/></svg></div>
<div class="ic" id="i-ia"><svg viewBox="0 0 24 24"><path d="M12 3.5l1.9 5.1 5.1 1.9-5.1 1.9L12 17.5l-1.9-5.1L5 10.5l5.1-1.9z"/><path d="M18.5 15.5l.8 2 2 .8-2 .8-.8 2-.8-2-2-.8 2-.8z"/></svg></div>
<div class="ic" id="i-renta"><svg viewBox="0 0 24 24"><path d="M6.5 3.5h8l3.5 3.5v13.5h-11.5z"/><path d="M14.5 3.5V7H18M9 17l6-6M9.6 11.6h.01M14.4 16.4h.01"/></svg></div>
<div class="ic" id="i-mercados"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M3.5 12h17M12 3.5c2.6 2.4 3.6 5.4 3.6 8.5s-1 6.1-3.6 8.5c-2.6-2.4-3.6-5.4-3.6-8.5s1-6.1 3.6-8.5z"/></svg></div>
<div class="ic" id="i-candado"><svg viewBox="0 0 24 24"><rect x="5" y="10.5" width="14" height="10" rx="2.5"/><path d="M8.5 10.5V8a3.5 3.5 0 0 1 7 0v2.5M12 14.5v2.5"/></svg></div>
<div id="hero"><svg width="496" height="200" viewBox="0 0 496 200">
<defs><linearGradient id="a" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e3b45f" stop-opacity=".34"/><stop offset="1" stop-color="#e3b45f" stop-opacity="0"/></linearGradient>
<linearGradient id="l" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#b5863a"/><stop offset=".6" stop-color="#e3b45f"/><stop offset="1" stop-color="#f7dfa8"/></linearGradient></defs>
<g stroke="#ffffff" stroke-opacity=".06"><path d="M0 50H496M0 100H496M0 150H496"/></g>
<path d="M0 168 C40 162 60 150 92 152 S150 128 186 132 S240 104 276 110 S330 86 362 78 S420 70 446 52 S484 40 496 34 L496 200 L0 200Z" fill="url(#a)"/>
<path d="M0 168 C40 162 60 150 92 152 S150 128 186 132 S240 104 276 110 S330 86 362 78 S420 70 446 52 S484 40 496 34" fill="none" stroke="url(#l)" stroke-width="3" stroke-linecap="round"/>
<circle cx="446" cy="52" r="5.5" fill="#f7dfa8"/><circle cx="446" cy="52" r="11" fill="#e3b45f" fill-opacity=".18"/>
</svg></div>
</body></html>
