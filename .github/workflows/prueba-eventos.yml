name: Prueba eventos (temporal)

on:
  push:
    branches: [v0.2]
    paths:
      - ".github/workflows/prueba-eventos.yml"

permissions:
  contents: write

jobs:
  prueba:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r scripts/requirements.txt
      - name: Campos de resultados y dividendos
        run: |
          mkdir -p salida
          python - <<'PY' > salida/eventos.txt 2>&1
          import json, yfinance as yf
          for s in ["AAPL", "MSFT", "NVDA", "KO", "O", "TTWO", "SAN.MC", "ITX.MC", "IBE.MC", "ASML.AS", "ALV.DE"]:
              try:
                  t = yf.Ticker(s)
                  info = t.info or {}
                  keys = {k: info.get(k) for k in info if any(w in k.lower() for w in ("earn", "divid", "exdiv", "timezone", "exchange"))}
                  print(s, json.dumps(keys, default=str))
                  print("  calendar", json.dumps(t.calendar, default=str))
              except Exception as e:
                  print(s, "error", e)
          PY
      - name: Subir el resultado a la rama prueba-eventos
        working-directory: salida
        run: |
          git init -q
          git checkout -q -b prueba-eventos
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "prueba"
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" prueba-eventos
