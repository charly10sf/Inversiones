# Un release de GitHub por versión. Cada vez que cambia el código en main, la etiqueta de la versión que está publicada
# (vX.Y.Z, la de VERSION en index.html) se mueve a ese commit, así que siempre apunta a cómo quedó esa versión con sus
# arreglos; y su release se crea o se actualiza con las novedades y los cambios (scripts/release.py). La APK la añade la
# Action «App Android» cuando compila. Para comparar dos versiones: github.com/<repo>/compare/v0.1.1...v0.2.3
#
# Las etiquetas de las versiones viejas apuntan a commits con otras Actions, y GitHub no deja que el token de la Action
# las cree («refusing to allow a GitHub App to create or update workflow»). Para eso está el secreto RELEASES_TOKEN:
# un token de grano fino solo de este repositorio con Contents y Workflows en lectura y escritura. Solo hace falta
# mientras falten releases antiguos; después puede caducar y la Action sigue con el suyo.
name: Release de la versión

on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "sw.js"
      - "en.json"
      - "cambios.json"
      - "scripts/**"
      - "android/**"
      - "worker/**"
      - ".github/workflows/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Etiquetas y releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASES_TOKEN: ${{ secrets.RELEASES_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python3 scripts/release.py --historial > versiones.json
          # las que falten, de la más antigua a la más nueva (así salen en orden), cada una en su commit;
          # la actual, además, se mueve al último commit y se le ponen las novedades y los cambios al día
          python3 - <<'PY2'
          import json, os, subprocess
          vs = json.load(open("versiones.json"))
          repo = os.environ["GITHUB_REPOSITORY"]
          llave = os.environ.get("RELEASES_TOKEN", "")
          def run(*a, env=None):
              return subprocess.run(list(a), capture_output=True, text=True, env={**os.environ, **(env or {})})
          def corto(t):
              return " ".join(t.replace(llave, "***").split())[:260] if llave else " ".join(t.split())[:260]
          remotas = {l.split("refs/tags/")[1] for l in run("git", "ls-remote", "--tags", "origin").stdout.splitlines() if "refs/tags/" in l and not l.endswith("^{}")}
          fallos, sin_llave = [], []
          for x in vs:
              tag = "v" + x["v"]
              open("notas.md", "w").write(x["cuerpo"])
              if x["actual"]:
                  # la actual se mueve al último commit, que tiene las mismas Actions que main: con el token de la Action vale
                  run("git", "tag", "-f", tag, x["sha"])
                  r = run("git", "push", "-f", "-q", "origin", tag)
                  if r.returncode != 0:
                      fallos.append(f"{tag}, etiqueta: " + corto(r.stderr))
                      continue
              elif tag not in remotas:
                  if not llave:
                      sin_llave.append(tag)
                      continue
                  r = run("gh", "api", "-X", "POST", f"repos/{repo}/git/refs", "-f", f"ref=refs/tags/{tag}", "-f", f"sha={x['sha']}", env={"GH_TOKEN": llave})
                  if r.returncode != 0:
                      fallos.append(f"{tag}, etiqueta en {x['sha'][:7]}: " + corto(r.stdout + r.stderr))
                      continue
              if run("gh", "release", "view", tag).returncode == 0:
                  if x["actual"]:
                      run("gh", "release", "edit", tag, "--title", x["nombre"], "--notes-file", "notas.md")
                  continue
              r = run("gh", "release", "create", tag, "--verify-tag", "--title", x["nombre"], "--notes-file", "notas.md", "--latest" if x["actual"] else "--latest=false")
              if r.returncode != 0:
                  fallos.append(f"{tag}, release: " + corto(r.stderr))
              else:
                  print(tag, "creado")
          # las versiones que ya no están en el historial (por ejemplo, una que se juntó con la anterior): fuera su release y su etiqueta
          validas = {"v" + x["v"] for x in vs}
          for tag in run("gh", "release", "list", "--limit", "200", "--json", "tagName", "-q", ".[].tagName").stdout.split():
              if tag.startswith("v") and tag[1:2].isdigit() and tag not in validas:
                  r = run("gh", "release", "delete", tag, "--yes", "--cleanup-tag")
                  print(tag, "borrado" if r.returncode == 0 else "sin borrar: " + corto(r.stderr))
          if sin_llave:
              print(f"::warning::Faltan {len(sin_llave)} releases antiguos ({sin_llave[0]} a {sin_llave[-1]}): GitHub no deja que la Action etiquete commits con otras Actions. Pon el secreto RELEASES_TOKEN (está explicado arriba en release.yml)")
          # GitHub enseña como mucho 10 avisos por paso
          for f in fallos[:8]:
              print("::warning::" + f)
          if len(fallos) > 8:
              print(f"::warning::y {len(fallos) - 8} más: " + ", ".join(f.split(",")[0] for f in fallos[8:]))
          print(f"::notice::Releases: {len(vs)} versiones, la actual {vs[-1]['v']}" + (f", {len(fallos) + len(sin_llave)} sin crear" if fallos or sin_llave else ", todas creadas"))
          PY2
      # version.json: la versión publicada y su título. La app de Android lo mira cada 3 horas para avisar en el móvil
      # cuando sale una versión nueva (Versiones.java). Se deja al día aquí para que no dependa de acordarse
      - name: version.json para el aviso de versiones nuevas
        run: |
          python3 - <<'PY3'
          import json
          x = json.load(open("versiones.json"))[-1]
          nuevo = {"v": x["v"], "t": x["nombre"].split(": ", 1)[-1]}
          try:
              viejo = json.load(open("version.json"))
          except Exception:
              viejo = None
          if viejo != nuevo:
              json.dump(nuevo, open("version.json", "w"), ensure_ascii=False)
              open("version.cambia", "w").write(x["v"])
              print("version.json:", nuevo)
          PY3
          if [ -f version.cambia ]; then
            git add version.json
            git commit -q -m "Versión $(cat version.cambia) publicada (version.json)"
            for i in 1 2 3 4 5; do
              git pull -q --rebase origin main && git push -q origin HEAD:main && break
              sleep 6
            done
          fi
