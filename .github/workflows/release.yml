# Un release de GitHub por versión. Cada vez que cambia el código en main, la etiqueta de la versión que está publicada
# (vX.Y.Z, la de VERSION en index.html) se mueve a ese commit, así que siempre apunta a cómo quedó esa versión con sus
# arreglos; y su release se crea o se actualiza con las novedades y los cambios (scripts/release.py). La APK la añade la
# Action «App Android» cuando compila. Para comparar dos versiones: github.com/<repo>/compare/v0.1.1...v0.2.3
name: Release de la versión

on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "sw.js"
      - "en.json"
      - "cambios.json"
      - "scripts/**"
      - "android/**"
      - "worker/**"
      - ".github/workflows/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Etiquetas y releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python3 scripts/release.py --historial > versiones.json
          # las que falten, de la más antigua a la más nueva (así salen en orden), cada una en su commit;
          # la actual, además, se mueve al último commit y se le ponen las novedades y los cambios al día
          python3 - <<'PY2'
          import json, subprocess
          vs = json.load(open("versiones.json"))
          def gh(*a):
              return subprocess.run(["gh", *a], capture_output=True, text=True)
          for x in vs:
              tag = "v" + x["v"]
              open("notas.md", "w").write(x["cuerpo"])
              existe = gh("release", "view", tag).returncode == 0
              if x["actual"]:
                  subprocess.run(["git", "tag", "-f", tag, x["sha"]], check=True)
                  subprocess.run(["git", "push", "-f", "-q", "origin", tag], check=True)
              if existe:
                  if x["actual"]:
                      gh("release", "edit", tag, "--title", x["nombre"], "--notes-file", "notas.md")
                  continue
              r = gh("release", "create", tag, "--target", x["sha"], "--title", x["nombre"], "--notes-file", "notas.md", "--latest" if x["actual"] else "--latest=false")
              print(tag, "creado" if r.returncode == 0 else "error: " + r.stderr.strip()[:200])
          print(f"::notice::Releases al día: {len(vs)} versiones, la actual {vs[-1]['v']}")
          PY2
