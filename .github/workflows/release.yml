# Un release de GitHub por versión. Cada vez que cambia el código en main, la etiqueta de la versión que está publicada
# (vX.Y.Z, la de VERSION en index.html) se mueve a ese commit, así que siempre apunta a cómo quedó esa versión con sus
# arreglos; y su release se crea o se actualiza con las novedades y los cambios (scripts/release.py). La APK la añade la
# Action «App Android» cuando compila. Para comparar dos versiones: github.com/<repo>/compare/v0.1.1...v0.2.3
name: Release de la versión

on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "sw.js"
      - "en.json"
      - "cambios.json"
      - "scripts/**"
      - "android/**"
      - "worker/**"
      - ".github/workflows/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Etiquetas y releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python3 scripts/release.py --historial > versiones.json
          # las que falten, de la más antigua a la más nueva (así salen en orden), cada una en su commit;
          # la actual, además, se mueve al último commit y se le ponen las novedades y los cambios al día
          python3 - <<'PY2'
          import json, subprocess
          vs = json.load(open("versiones.json"))
          def run(*a):
              return subprocess.run(list(a), capture_output=True, text=True)
          remotas = {l.split("refs/tags/")[1] for l in run("git", "ls-remote", "--tags", "origin").stdout.splitlines() if "refs/tags/" in l and not l.endswith("^{}")}
          fallos = []
          for x in vs:
              tag = "v" + x["v"]
              open("notas.md", "w").write(x["cuerpo"])
              # primero la etiqueta, con git (así, si GitHub no deja, dice por qué); la actual se mueve al último commit
              if x["actual"] or tag not in remotas:
                  run("git", "tag", "-f", tag, x["sha"])
                  r = run("git", "push", "-f", "-q", "origin", tag)
                  if r.returncode != 0:
                      fallos.append(f"{tag}, etiqueta en {x['sha'][:7]}: " + " ".join(r.stderr.split())[:260])
                      continue
              if run("gh", "release", "view", tag).returncode == 0:
                  if x["actual"]:
                      run("gh", "release", "edit", tag, "--title", x["nombre"], "--notes-file", "notas.md")
                  continue
              r = run("gh", "release", "create", tag, "--verify-tag", "--title", x["nombre"], "--notes-file", "notas.md", "--latest" if x["actual"] else "--latest=false")
              if r.returncode != 0:
                  fallos.append(f"{tag}, release: " + " ".join(r.stderr.split())[:260])
              else:
                  print(tag, "creado")
          # GitHub enseña como mucho 10 avisos por paso
          for f in fallos[:8]:
              print("::warning::" + f)
          if len(fallos) > 8:
              print(f"::warning::y {len(fallos) - 8} más: " + ", ".join(f.split(",")[0] for f in fallos[8:]))
          print(f"::notice::Releases: {len(vs)} versiones, la actual {vs[-1]['v']}, {len(fallos)} sin poder crear")
          PY2
