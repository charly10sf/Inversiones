# El relevo de la IA en Google Cloud Run (0.8.3d; relevo/): reenvía al Worker de Cloudflare lo que la app no puede mandarle
# directamente cuando los operadores españoles bloquean Cloudflare durante los partidos de LaLiga.
#
# Va en un proyecto de Google APARTE (no en el de Firebase, que sigue en Spark), montado una vez con relevo/montar.sh
# (con el sí de Carlos: pide facturación, con un presupuesto de 5 € al mes que, al llegar, la quita sola).
# NO HACE NADA sin las variables RELEVO_PROYECTO, RELEVO_WIF y RELEVO_EN_VIVO = si (las dice montar.sh al acabar).
# Sin claves: entra en Google con Workload Identity, que solo acepta esta Action desde main de charly10sf/Inversiones,
# como relevo-publica@… (publicar en Cloud Run). El servicio corre con otra cuenta, relevo@…, SIN NINGÚN PAPEL.
#
# Lo que publica: toison-relevo en europe-southwest1 (Madrid), público (la app no tiene cuenta de Google; quién eres lo
# mira el Worker con tu token), 1 vCPU, 256 MiB, hasta 80 peticiones a la vez, 0 instancias cuando no se usa (no cuesta
# nada parado) y como mucho 1 (tope de gasto si alguien lo abusa), 300 s por petición (la IA tarda 60–100 s).
name: Relevo

on:
  push:
    branches: [main]
    paths: ['relevo/**', '.github/workflows/relevo.yml']
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: relevo
  cancel-in-progress: false

jobs:
  relevo:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: ¿Se publica?
        id: puerta
        env:
          EN_VIVO: ${{ vars.RELEVO_EN_VIVO }}
          PROYECTO: ${{ vars.RELEVO_PROYECTO }}
          WIF: ${{ vars.RELEVO_WIF }}
        run: |
          if [ -z "$PROYECTO" ] || [ -z "$WIF" ]; then echo "::warning::Faltan RELEVO_PROYECTO o RELEVO_WIF (relevo/montar.sh): no se publica nada."; echo "seguir=no" >> "$GITHUB_OUTPUT"; exit 0; fi
          if [ "$EN_VIVO" != "si" ]; then echo "::notice::RELEVO_EN_VIVO no vale «si»: no se publica nada."; echo "seguir=no" >> "$GITHUB_OUTPUT"; exit 0; fi
          echo "seguir=si" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        if: steps.puerta.outputs.seguir == 'si'
      - uses: google-github-actions/auth@v2
        if: steps.puerta.outputs.seguir == 'si'
        with:
          workload_identity_provider: ${{ vars.RELEVO_WIF }}
          service_account: relevo-publica@${{ vars.RELEVO_PROYECTO }}.iam.gserviceaccount.com
      - uses: google-github-actions/setup-gcloud@v2
        if: steps.puerta.outputs.seguir == 'si'
      - name: Publicar en Cloud Run
        if: steps.puerta.outputs.seguir == 'si'
        env:
          P: ${{ vars.RELEVO_PROYECTO }}
        run: |
          gcloud run deploy toison-relevo \
            --project "$P" --region europe-southwest1 \
            --source relevo --allow-unauthenticated \
            --cpu 1 --memory 256Mi --concurrency 80 \
            --min-instances 0 --max-instances 1 --timeout 300 \
            --cpu-boost \
            --service-account "relevo@$P.iam.gserviceaccount.com" \
            --set-env-vars "^@^DESTINO=https://growfolio.growfolio-web-app.workers.dev@ORIGENES=https://charly10sf.github.io,https://toison.es" \
            --quiet
          url=$(gcloud run services describe toison-relevo --project "$P" --region europe-southwest1 --format 'value(status.url)')
          echo "::notice::Relevo en $url (ponerlo en RELEVO, src/js/32a-ruta-worker.js)"
          code=$(curl -s --max-time 30 -o /dev/null -w '%{http_code}' "$url/salud")
          echo "::notice::$url/salud → $code"
          [ "$code" = "200" ] || { echo "::error::El relevo no llega al Worker (/salud → $code)"; exit 1; }
