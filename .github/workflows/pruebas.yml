# Las pruebas de GrowFolio en cada push (cualquier rama de código) y en cada pull request: el build con Vite,
# las de Python de los scripts y las de Playwright de la web (tests/) sobre ese build, en el móvil y en el ordenador, sin salir a internet:
# Firebase de imitación y los datos de verdad de las ramas datos y catalogo.
name: Pruebas

on:
  push:
    branches-ignore: [datos, catalogo, android-registro]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pruebas-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pruebas:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - name: Dependencias
        run: |
          npm ci
          npx playwright install --with-deps chromium
          pip install -r scripts/requirements.txt

      - name: Datos de las ramas datos y catalogo
        run: sh tests/traer-datos.sh

      - name: Pruebas de los scripts
        run: python -m unittest discover -s tests/scripts -v

      - name: Build (Vite)
        run: npm run build

      - name: Pruebas de la web (sobre el build)
        run: npx playwright test

      - name: Presupuesto de rendimiento (solo, sin otras pruebas a la vez)
        run: npm run rendimiento

      # «nadie nota nada»: una cartera creada con lo que hay publicado (main) se abre igual con este build
      - name: Subida desde la versión publicada
        run: |
          git fetch -q --depth=1 origin main
          git worktree add -q /tmp/antes origin/main
          if [ -f /tmp/antes/package.json ] && grep -q '"build"' /tmp/antes/package.json; then
            (cd /tmp/antes && npm ci --silent && npm run build --silent) && export GF_ANTES=/tmp/antes/dist
          else
            export GF_ANTES=/tmp/antes
          fi
          GF_ANTES=$GF_ANTES npx playwright test tests/subida.spec.js --project=movil

      - name: Informe si algo falla
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: informe-pruebas
          path: |
            playwright-report/
            test-results/
          retention-days: 7
