# Las pruebas de GrowFolio en cada push (cualquier rama de código) y en cada pull request:
# las de Python de los scripts y las de Playwright de la web (tests/), en el móvil y en el ordenador, sin salir a internet:
# Firebase de imitación y los datos de verdad de las ramas datos y catalogo.
name: Pruebas

on:
  push:
    branches-ignore: [datos, catalogo, android-registro]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pruebas-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pruebas:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - name: Dependencias
        run: |
          npm ci
          npx playwright install --with-deps chromium
          pip install -r scripts/requirements.txt

      - name: Datos de las ramas datos y catalogo
        run: sh tests/traer-datos.sh

      - name: Pruebas de los scripts
        run: python -m unittest discover -s tests/scripts -v

      - name: Pruebas de la web
        run: npx playwright test

      - name: Informe si algo falla
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: informe-pruebas
          path: |
            playwright-report/
            test-results/
          retention-days: 7
