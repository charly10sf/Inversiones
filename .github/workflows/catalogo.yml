name: Catálogo

# Una vez al día: precio e histórico de los fondos, ETF, oro y cripto de catalogo.json, para que
# cualquiera que use la web encuentre su fondo exacto. Se publica en la rama "catalogo".
on:
  schedule:
    - cron: "23 4 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "catalogo.json"
      - "scripts/catalogo.py"
      - ".github/workflows/catalogo.yml"

permissions:
  contents: write

concurrency:
  group: catalogo
  cancel-in-progress: false

jobs:
  catalogo:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - name: Instalar dependencias
        run: pip install -r scripts/requirements.txt

      - name: Recuperar el catálogo anterior
        run: |
          mkdir -p anterior
          if git fetch --depth=1 origin catalogo 2>/dev/null; then
            git --work-tree=anterior checkout origin/catalogo -- . 2>/dev/null || true
            git reset -q
          fi

      - name: Precios del catálogo
        run: python scripts/catalogo.py catalogo.json anterior salida

      - name: Publicar en la rama catalogo
        working-directory: salida
        run: |
          git init -q
          git checkout -q -b catalogo
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Catálogo $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" catalogo
