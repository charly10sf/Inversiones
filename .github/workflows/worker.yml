# Publica el Worker de GrowFolio (worker/) en Cloudflare y le pone sus secretos.
# Hace falta en GitHub (Settings > Secrets and variables > Actions):
#   CLOUDFLARE_API_TOKEN y CLOUDFLARE_ACCOUNT_ID  para publicar
#   EB_CLAVE (el .pem de Enable Banking), EB_APP (su Application ID) y BANCO_EMAILS (quién puede usar el banco)
#   PRECIOS_TOKEN (token de grano fino de este repositorio con Actions en escritura: el Worker lanza con él los precios)
#   ANTHROPIC_API_KEY (la clave de la API de Claude, de un workspace con límite de gasto) y CLAUDE_EMAILS (los correos del
#   tope alto, separados por comas; desde la 0.8.2d contesta cualquiera con el correo verificado, y el resto con el tope
#   reducido). Sin la clave, la IA de la app no contesta (desde la 0.8.2d no hay Gemini de reserva).
#   OJO: quitarlas de GitHub NO las borra del Worker (esta Action solo pone las que tienen valor). Para cortar Claude de
#   golpe: revocar la clave en la Console de Anthropic, o «npx wrangler secret delete ANTHROPIC_API_KEY» dentro de worker/.
# Ninguno se escribe en el repositorio ni sale en el registro. Lo que pase sale como aviso en la ejecución.
name: Worker

on:
  push:
    branches: [main, v0.2.3]
    paths: ['worker/**', '.github/workflows/worker.yml']
  workflow_dispatch:
    inputs:
      prueba:
        description: '«correos»: publica el Worker de pruebas growfolio-correos (solo con lo de los correos) y manda los tres a la cuenta de prueba'
        required: false
        default: 'no'
        type: choice
        options: ['no', 'correos']

permissions:
  contents: read

concurrency:
  group: worker
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: ¿Están las claves de Cloudflare?
        id: cf
        env:
          T: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          A: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$T" ] || [ -z "$A" ]; then
            echo "::warning::Faltan CLOUDFLARE_API_TOKEN o CLOUDFLARE_ACCOUNT_ID en los secretos: el Worker no se publica"
            echo "ok=no" >> "$GITHUB_OUTPUT"
          else
            echo "ok=si" >> "$GITHUB_OUTPUT"
          fi
      - name: Publicar
        if: steps.cf.outputs.ok == 'si' && inputs.prueba != 'correos'
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -o pipefail
          if ! npx --yes wrangler@4 deploy 2>&1 | tee salida.txt; then
            echo "::error::No se ha podido publicar: $(grep -iE 'error|✘' salida.txt | head -3 | tr '\n' ' ' | cut -c1-300)"
            exit 1
          fi
          url=$(grep -oE 'https://[a-z0-9.-]+\.workers\.dev' salida.txt | head -1)
          echo "::notice::Worker publicado en ${url:-(sin dirección workers.dev: actívala en Cloudflare > Workers)}"
      - name: Secretos del Worker
        if: steps.cf.outputs.ok == 'si' && inputs.prueba != 'correos'
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          EB_CLAVE: ${{ secrets.EB_CLAVE }}
          EB_APP: ${{ secrets.EB_APP }}
          BANCO_EMAILS: ${{ secrets.BANCO_EMAILS }}
          PRECIOS_TOKEN: ${{ secrets.PRECIOS_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_EMAILS: ${{ secrets.CLAUDE_EMAILS }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          FIREBASE_CORREO: ${{ secrets.FIREBASE_CORREO }}
        run: |
          poner() {
            if [ -n "$2" ]; then
              if printf '%s' "$2" | npx --yes wrangler@4 secret put "$1" > /dev/null 2>&1; then echo "::notice::$1 puesto en el Worker"; else echo "::error::No se ha podido poner $1"; fi
            else
              echo "::warning::Falta el secreto $1 en GitHub: ${3:-la conexión con el banco} no funcionará hasta ponerlo"
            fi
          }
          poner EB_CLAVE "$EB_CLAVE"
          poner EB_APP "$EB_APP"
          poner BANCO_EMAILS "$BANCO_EMAILS"
          poner PRECIOS_TOKEN "$PRECIOS_TOKEN" "la actualización de precios cada 20 minutos"
          poner ANTHROPIC_API_KEY "$ANTHROPIC_API_KEY" "GrowIA con Claude"
          poner CLAUDE_EMAILS "$CLAUDE_EMAILS" "GrowIA con Claude"
          # 0.8.3: los correos propios (sin ellos, la app manda los de Firebase de siempre)
          poner RESEND_API_KEY "$RESEND_API_KEY" "los correos propios desde noreply@toison.es"
          poner FIREBASE_CORREO "$FIREBASE_CORREO" "los correos propios desde noreply@toison.es"
          # la clave para firmar la vuelta del banco: se crea una vez y se queda
          if ! npx --yes wrangler@4 secret list 2>/dev/null | grep -q '"ESTADO"'; then poner ESTADO "$(openssl rand -hex 32)"; fi

      # 0.8.3: el Worker de pruebas de los correos (growfolio-correos), desde cualquier rama y sin tocar el de verdad. Solo lleva
      # la clave de Resend, la cuenta de servicio y un token de pruebas que nadie ve; manda los tres correos a la cuenta de prueba
      - name: Worker de pruebas de los correos
        if: steps.cf.outputs.ok == 'si' && inputs.prueba == 'correos'
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          FIREBASE_CORREO: ${{ secrets.FIREBASE_CORREO }}
        run: |
          set -o pipefail
          if [ -z "$RESEND_API_KEY" ] || [ -z "$FIREBASE_CORREO" ]; then echo "::error::Faltan RESEND_API_KEY o FIREBASE_CORREO en los secretos de GitHub"; exit 1; fi
          N=growfolio-correos
          npx --yes wrangler@4 deploy --env correos 2>&1 | tee salida.txt
          url=$(grep -oE "https://$N\.[a-z0-9.-]+\.workers\.dev" salida.txt | head -1)
          if [ -z "$url" ]; then echo "::error::No sale la dirección del Worker de pruebas"; exit 1; fi
          T=$(openssl rand -hex 24)
          printf '%s' "$RESEND_API_KEY" | npx --yes wrangler@4 secret put RESEND_API_KEY --env correos > /dev/null
          printf '%s' "$FIREBASE_CORREO" | npx --yes wrangler@4 secret put FIREBASE_CORREO --env correos > /dev/null
          printf '%s' "$T" | npx --yes wrangler@4 secret put PRUEBA_TOKEN --env correos > /dev/null
          sleep 15
          echo "::notice::Worker de pruebas: $url ($(curl -s "$url/salud"))"
          for tipo in confirmar clave bienvenida; do
            r=$(curl -s -X POST "$url/correo/prueba" -H "X-Prueba: $T" -H 'Content-Type: application/json' -H 'Origin: https://toison.es' -d "{\"tipo\":\"$tipo\",\"lang\":\"es\",\"base\":\"https://charly10sf.github.io/Inversiones/\"}")
            echo "::notice::$tipo: $r"
            sleep 2
          done
          # el token de pruebas se cambia al acabar: el de esta vuelta ya no vale para nada
          openssl rand -hex 24 | npx --yes wrangler@4 secret put PRUEBA_TOKEN --env correos > /dev/null
