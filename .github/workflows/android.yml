name: App Android

# Compila la app de Android (la web dentro de una app, con su widget) y la publica en
# github.com/charly10sf/Inversiones/releases/tag/app. La firma usa android/firma.p12, cifrada con el
# secreto ANDROID_CLAVE; si la clave no existe todavía, la crea la primera vez. Sin el secreto, compila
# con una clave de prueba para comprobar que todo funciona, pero no publica nada.
on:
  push:
    branches: [main]
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Clave de firma
        env:
          CLAVE: ${{ secrets.ANDROID_CLAVE }}
        run: |
          if [ -z "$CLAVE" ]; then
            keytool -genkeypair -keystore /tmp/prueba.p12 -storetype PKCS12 -alias inversiones -keyalg RSA -keysize 2048 -validity 10000 -storepass prueba123 -keypass prueba123 -dname "CN=Prueba"
            echo "FIRMA=prueba" >> "$GITHUB_ENV"
            echo "FIRMA_RUTA=/tmp/prueba.p12" >> "$GITHUB_ENV"
            keytool -genkeypair -keystore /tmp/subida-prueba.p12 -storetype PKCS12 -alias subida -keyalg RSA -keysize 2048 -validity 10000 -storepass prueba123 -keypass prueba123 -dname "CN=Prueba"
            echo "SUBIDA_RUTA=/tmp/subida-prueba.p12" >> "$GITHUB_ENV"
          else
            if [ ! -f android/firma.p12 ]; then
              keytool -genkeypair -keystore android/firma.p12 -storetype PKCS12 -alias inversiones -keyalg RSA -keysize 3072 -validity 20000 -storepass "$CLAVE" -keypass "$CLAVE" -dname "CN=Inversiones"
              git config user.name "github-actions[bot]"
              git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
              git add android/firma.p12
              git commit -q -m "App: clave de firma, cifrada con el secreto ANDROID_CLAVE"
              git pull -q --rebase origin main && git push -q origin HEAD:main
            fi
            # 0.8.3 · la clave de SUBIDA de Google Play (Play App Signing): otra distinta de la de la APK, con la misma
            # contraseña. Se crea una sola vez y se guarda en la rama en la que corre (nunca en main desde otra rama).
            # Play la toma como clave de subida con el primer .aab que se suba: desde entonces, NO SE CAMBIA (si se
            # pierde, se pide a Google cambiarla con el certificado nuevo). Su certificado va con el .aab (subida.pem)
            if [ ! -f android/subida.p12 ]; then
              keytool -genkeypair -keystore android/subida.p12 -storetype PKCS12 -alias subida -keyalg RSA -keysize 4096 -validity 20000 -storepass "$CLAVE" -keypass "$CLAVE" -dname "CN=Toison, O=Toison, C=ES"
              git config user.name "github-actions[bot]"
              git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
              git add android/subida.p12
              git commit -q -m "App: clave de subida de Google Play, cifrada con el secreto ANDROID_CLAVE"
              # si no se puede guardar, se para aquí: un .aab firmado con una clave perdida no debe llegar a Play
              if ! { git pull -q --rebase origin "$GITHUB_REF_NAME" && git push -q origin "HEAD:$GITHUB_REF_NAME"; }; then
                echo "::error::No se ha podido guardar la clave de subida en la rama $GITHUB_REF_NAME"; exit 1
              fi
              echo "::notice::Clave de subida de Play creada y guardada en la rama $GITHUB_REF_NAME"
            fi
            keytool -exportcert -rfc -keystore android/subida.p12 -storetype PKCS12 -alias subida -storepass "$CLAVE" -file subida.pem
            echo "::notice::Clave de subida de Play: $(keytool -list -v -keystore android/subida.p12 -storetype PKCS12 -alias subida -storepass "$CLAVE" | grep -E 'SHA1:|SHA256:' | tr -s ' ' | tr '\n' ' ')"
            echo "FIRMA=buena" >> "$GITHUB_ENV"
            echo "FIRMA_RUTA=$GITHUB_WORKSPACE/android/firma.p12" >> "$GITHUB_ENV"
            echo "SUBIDA_RUTA=$GITHUB_WORKSPACE/android/subida.p12" >> "$GITHUB_ENV"
          fi

      - name: Versión
        run: |
          v=$(grep -ohP "^const VERSION = '\K[0-9.]+[a-z]?" src/js/version.js index.html 2>/dev/null | head -1)
          echo "VERSION_NAME=${v:-0.0.0}" >> "$GITHUB_ENV"
          echo "Versión ${v:-0.0.0}, compilación ${{ github.run_number }}"

      - name: Compilar
        working-directory: android
        env:
          FIRMA_CLAVE: ${{ secrets.ANDROID_CLAVE || 'prueba123' }}
          VERSION_CODE: ${{ github.run_number }}
        run: |
          set -o pipefail
          gradle assembleDirectaRelease bundlePlayRelease --no-daemon --stacktrace 2>&1 | tee "$GITHUB_WORKSPACE/compilacion.log"

      # 0.8.3: lo que Play mira en la de Play. Si algo de esto falla, la Action se para antes de guardar nada
      - name: Revisar la versión de Play
        run: |
          AAB=android/app/build/outputs/bundle/playRelease/app-play-release.aab
          M=android/app/build/intermediates/merged_manifest/playRelease/processPlayReleaseMainManifest/AndroidManifest.xml
          [ -f "$M" ] || M=$(find android/app/build/intermediates -path '*playRelease*' -name AndroidManifest.xml | head -1)
          echo "manifiesto: $M"
          mal=0
          falta() { grep -q -- "$1" "$M" || { echo "::error::Al manifiesto de Play le falta: $1"; mal=1; }; }
          sobra() { if grep -q -- "$1" "$M"; then echo "::error::Al manifiesto de Play le sobra: $1"; mal=1; fi; }
          falta 'package="es.toison.app"'
          falta 'android:targetSdkVersion="36"'
          falta 'FOREGROUND_SERVICE_DATA_SYNC'
          falta 'foregroundServiceType="shortService|dataSync"'
          sobra 'REQUEST_INSTALL_PACKAGES'
          sobra 'UPDATE_PACKAGES_WITHOUT_USER_ACTION'
          sobra 'es.inversiones.app.Instalado'
          # ni el código que abre el instalador de paquetes (el de src/directa) dentro de la de Play
          D=$(mktemp -d); unzip -q -o "$AAB" 'base/dex/*' -d "$D"
          for t in 'android.settings.MANAGE_UNKNOWN_APP_SOURCES' 'no se pudo abrir el instalador' 'charly10sf/Inversiones/releases/'; do
            if grep -a -q -- "$t" "$D"/base/dex/*.dex; then echo "::error::La de Play lleva código de instalar APK ($t)"; mal=1; fi
          done
          [ "$mal" = 0 ] || exit 1
          echo "::notice::Versión de Play revisada: es.toison.app, targetSdk 36, sin permisos ni código de instalar APK, dataSync declarado"

      # solo desde main: en otras ramas se compila para probar, sin publicar
      # 0.8.3: la versión de Google Play (paquete .aab, firmado con la clave de subida) se guarda en la ejecución para
      # subirla a mano a Play Console; no se publica en ningún sitio. Solo con la firma buena: con la de prueba no vale
      - name: Guardar la versión de Play
        if: env.FIRMA == 'buena'
        uses: actions/upload-artifact@v4
        with:
          name: toison-play-${{ github.run_number }}
          path: |
            android/app/build/outputs/bundle/playRelease/app-play-release.aab
            subida.pem
          retention-days: 30

      - name: Publicar la app
        if: env.FIRMA == 'buena' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp android/app/build/outputs/apk/directa/release/app-directa-release.apk growfolio.apk
          # inversiones.apk es la misma: la buscan las apps de antes de que el proyecto se llamara GrowFolio
          cp growfolio.apk inversiones.apk
          gh release view app >/dev/null 2>&1 || gh release create app --title "App de Android" --notes "GrowFolio como app, con widget para la pantalla de inicio. Descarga growfolio.apk e instálala."
          gh release upload app growfolio.apk inversiones.apk --clobber
          gh release edit app --notes "GrowFolio como app, con widget para la pantalla de inicio. Descarga growfolio.apk e instálala." || true
          gh release edit app --title "App de Android $VERSION_NAME" --latest=false || true
          # y la APK de esta versión en su propio release (vX.Y.Z), que no se borra con las siguientes
          cp growfolio.apk "growfolio-$VERSION_NAME.apk"
          # el release lo crea la Action «Release de la versión»: se espera a que esté (hasta 5 minutos)
          for i in $(seq 1 20); do gh release view "v$VERSION_NAME" >/dev/null 2>&1 && break; sleep 15; done
          gh release upload "v$VERSION_NAME" "growfolio-$VERSION_NAME.apk" --clobber || echo "::warning::No se ha podido subir la APK al release v$VERSION_NAME"
          # la dirección vieja a propósito: las apps de antes de GrowFolio solo aceptan esa, y tras renombrar el repositorio
          # GitHub la redirige a la nueva. Las apps nuevas aceptan las dos
          printf '{"version": %s, "nombre": "%s", "apk": "https://github.com/charly10sf/Inversiones/releases/download/app/inversiones.apk"}\n' "${{ github.run_number }}" "$VERSION_NAME" > app.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # encima de lo último de main (a la vez suele entrar el version.json de la Action del release): solo app.json.
          # Antes era «pull --rebase», que con el checkout corto fallaba si main se había movido y app.json no subía
          for i in 1 2 3 4 5; do
            git fetch -q origin main
            git reset -q origin/main
            git add app.json
            git diff --cached --quiet && break
            git commit -q -m "App: versión ${{ github.run_number }} publicada"
            git push -q origin HEAD:main && break
            sleep 6
          done

      # el registro de la compilación, en la rama android-registro, para poder revisarlo si falla
      - name: Guardar el registro
        if: always()
        run: |
          mkdir -p /tmp/registro && cd /tmp/registro
          cp "$GITHUB_WORKSPACE/compilacion.log" . 2>/dev/null || echo "sin registro" > compilacion.log
          tail -c 60000 compilacion.log > ultimo.log
          echo "run ${{ github.run_number }} firma ${FIRMA:-?} $(date -u +%FT%TZ)" > estado.txt
          ls -la "$GITHUB_WORKSPACE/android/app/build/outputs/apk/directa/release/" "$GITHUB_WORKSPACE/android/app/build/outputs/bundle/playRelease/" >> estado.txt 2>&1 || true
          rm compilacion.log
          git init -q && git checkout -q -b android-registro
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A && git commit -q -m "Registro ${{ github.run_number }}"
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" android-registro
