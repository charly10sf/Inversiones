name: Precios

# Descarga los precios y los publica en la rama "datos" (un único commit que se sobrescribe).
# Horario en UTC: de lunes a viernes cada 20 minutos de 6:00 a 21:59 UTC (8:00-23:59 en Madrid en verano),
# en minutos sueltos (7, 27, 47) porque GitHub retrasa o se salta más las tareas de las horas en punto,
# y cada 4 horas el fin de semana (Bitcoin y noticias; en la web Bitcoin además va en directo).
on:
  schedule:
    - cron: "7,27,47 6-21 * * 1-5"
    - cron: "17 */4 * * 0,6"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "instrumentos.json"
      - "scripts/**"
      - ".github/workflows/precios.yml"

permissions:
  contents: write

concurrency:
  group: precios
  cancel-in-progress: false

jobs:
  precios:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - name: Instalar dependencias
        run: pip install -r scripts/requirements.txt

      - name: Recuperar los datos anteriores
        run: |
          mkdir -p anterior
          if git fetch --depth=1 origin datos 2>/dev/null; then
            git show origin/datos:precios.json > anterior/precios.json || true
            git show origin/datos:historico.json > anterior/historico.json || true
            git show origin/datos:radar.json > anterior/radar.json || true
            git show origin/datos:radar-hist.json > anterior/radar-hist.json || true
            git show origin/datos:informe.json > anterior/informe.json || true
            git show origin/datos:escaneo.json > anterior/escaneo.json || true
            git show origin/datos:noticias-cache.json > anterior/noticias-cache.json || true
            git show origin/datos:traduccion-en.json > anterior/traduccion-en.json || true
            git show origin/datos:fichas.json > anterior/fichas.json || true
          fi
          # los precios de los fondos del catálogo, para los avisos del móvil (avisos.json)
          if git fetch --depth=1 origin catalogo 2>/dev/null; then
            git show origin/catalogo:catalogo-precios.json > anterior/catalogo-precios.json || true
          fi

      - name: Descargar precios
        run: |
          mkdir -p salida
          python scripts/precios.py instrumentos.json anterior salida

      # Un resumen mínimo para el widget de la app de Android: precios y cierres del último año (unos 35 KB en vez de los 90 de precios.json)
      - name: Precios para el widget
        run: |
          python - <<'PY'
          import json, datetime
          d = json.load(open("salida/precios.json"))
          p = {k: [v.get("precio"), v.get("cierre_anterior")] for k, v in (d.get("instrumentos") or {}).items() if v.get("precio") is not None}
          # los cierres para que el widget dibuje él solo su gráfica (1 semana, 1 mes, 3 meses o 1 año, lo que elijas en
          # él): día a día los últimos 100 días y, antes, el último de cada semana hasta un año (unos 35 KB). Las APK
          # de antes de la 0.2.4 solo miran el último mes, así que les da igual que haya más
          h = {}
          try:
              hi = json.load(open("salida/historico.json"))
              hoy = datetime.date.today()
              diario = (hoy - datetime.timedelta(days=100)).isoformat()
              anio = (hoy - datetime.timedelta(days=372)).isoformat()
              for k, s in (hi.get("instrumentos") or {}).items():
                  ant = [x for x in s if x[0] < anio][-1:]
                  semanas = {}
                  for x in s:
                      if anio <= x[0] < diario:
                          semanas[datetime.date.fromisoformat(x[0][:10]).isocalendar()[:2]] = x
                  h[k] = ant + sorted(semanas.values()) + [x for x in s if x[0] >= diario]
          except Exception as e:
              print("sin cierres para el widget:", e)
          # y los precios de cada 30 minutos de los últimos días (los de intradia.json), para las 24 horas y la semana
          # del widget (desde la 0.3.0b; las APK de antes no los miran)
          i = {}
          try:
              i = json.load(open("salida/intradia.json")).get("p") or {}
          except Exception as e:
              print("sin intradía para el widget:", e)
          json.dump({"generado": d.get("generado"), "p": p, "h": h, "i": i}, open("salida/widget.json", "w"), separators=(",", ":"))
          # Para los avisos de la app (solo los baja si los activas y tienes algo fuera de los precios comunes):
          # el radar {símbolo: [precio en €, % del día]} y el catálogo de fondos {id: [precio, anterior]}
          r, c = {}, {}
          for f in ("salida/radar.json", "anterior/radar.json"):
              try:
                  for x in json.load(open(f)).get("valores") or []:
                      pe = x.get("pe") if x.get("pe") is not None else x.get("p")
                      if x.get("s") and pe:
                          r[str(x["s"]).upper()] = [round(pe, 4), round(x.get("v"), 2) if x.get("v") is not None else None]
                  break
              except Exception as e:
                  print("sin radar para los avisos:", f, e)
          try:
              for k, x in (json.load(open("anterior/catalogo-precios.json")).get("v") or {}).items():
                  if x.get("p"):
                      c[k] = [x.get("p"), x.get("pa")]
          except Exception as e:
              print("sin catálogo para los avisos:", e)
          json.dump({"generado": d.get("generado"), "r": r, "c": c}, open("salida/avisos.json", "w"), separators=(",", ":"))
          print("avisos.json:", len(r), "del radar,", len(c), "fondos")
          PY

      # Noticias de un lote de empresas en cada pasada; Gemini las lee, y cada 2 horas escribe el
      # informe de tu cartera y elige ideas entre todo el radar. Necesita el secreto GEMINI_API_KEY;
      # si falla, se queda lo anterior.
      - name: Escaneo de prensa e informe de Gemini
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python scripts/informe.py instrumentos.json anterior salida || echo "el informe no se pudo generar"

      # 0.4: lo que escribe Gemini y los titulares en español, también en inglés (para la app en inglés). Cada
      # texto se traduce una vez, con el modelo más barato; lo que falte, en la siguiente pasada.
      # con su propio límite de tiempo y sin poder tumbar la pasada: los precios se publican igual
      - name: Traducir al inglés
        timeout-minutes: 8
        continue-on-error: true
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python scripts/traducir.py instrumentos.json anterior salida || echo "sin traducción esta vez"

      # la rama datos se publica entera desde salida/: si no hay archivo nuevo, se queda el de antes
      - name: Guardar la traducción anterior si no hay nueva
        run: |
          [ -f salida/traduccion-en.json ] || cp anterior/traduccion-en.json salida/ 2>/dev/null || true

      - name: Guardar las fichas anteriores si no hay nuevas
        run: |
          [ -f salida/fichas.json ] || cp anterior/fichas.json salida/ 2>/dev/null || true

      - name: Publicar en la rama datos
        working-directory: salida
        run: |
          git init -q
          git checkout -q -b datos
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Precios $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" datos
